# 这个仓库从 2026-08-28 起是个 workspace。根包仍然是 `dct` 本身——**没有把
# `src/` 搬进 `crates/dct/`**，那会产生一个几百个文件的 rename diff，把真正
# 的改动淹掉，而唯一的收获是目录看起来整齐。
#
[workspace]
members = ["crates/dct-link", "crates/dct-page", "crates/dct-srv"]

[package]
name = "dct"
version = "0.2.6"
edition = "2021"

[dependencies]
anyhow = "1"
# 跟中转服务共用的信封。`dct` 和 `dct-srv` 谁也不依赖谁，共同依赖这个。
dct-link = { path = "crates/dct-link" }
# 手机端那一页网页。放在共享 crate 里是因为中转也要发同一份——见那边的注释。
dct-page = { path = "crates/dct-page" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
portable-pty = "0.8"
# 0.15.2 有个真实 bug：滚动偏移一旦超过屏幕行数，读屏幕内容就会
# panic（grid.rs 里 `rows_len - scrollback_offset` 直接减，越界）。
# 0.16 把它改成了 saturating_sub。翻到一屏之外正是这个功能的意义
# 所在，所以不能留在 0.15。
vt100 = "0.16"
ratatui = "0.28"
crossterm = "0.28"
unicode-width = "0.1.14"
libc = "0.2.189"
# token 必须来自操作系统的 CSPRNG。这是唯一一处"自己想办法"会直接变成
# 安全缺陷的地方：拿时间戳当种子的话，同一个局域网里的人知道你大概什么
# 时候开的手机端，就能把 token 的搜索空间压到能暴力试的程度。
# getrandom 只包一层各平台的系统调用，没有 C，也没有别的依赖。
getrandom = "0.2"
qrcode = { version = "0.14.1", default-features = false }
# 校验下载回来的 Node 运行时。纯 Rust，默认特性不带 asm 也不带 C——
# 「整棵依赖树里一行 C 都没有」这条性质是 Windows 上不用装 Visual Studio
# Build Tools 的全部理由，不能为了一个哈希把它丢掉。
sha2 = "0.10"

[dev-dependencies]
rqrr = "0.10.1"
tempfile = "3"

# TLS 后端按平台分叉。
#
# **这里曾经写着「ureq 在只开 native-tls 时会自己挑它做默认，所以三处
# AgentBuilder 一行都不用改」——那句话是反的**，而且反得很贵：Windows 上
# 每一次 HTTPS 请求都失败，报 `no TLS backend is configured`，而密钥验证、
# 会话起名、手机通知这三条路全都零测试覆盖（测试不碰网络），于是这个 bug
# 一直没人撞见。ureq 自己的注释写在 lib.rs:401：native-tls「must be
# configured via the AgentBuilder，it is never picked up as a default」。
# 现在所有 agent 都从 `sys::tls::agent_builder()` 出来，那里显式装后端，
# 别再在别处 `ureq::AgentBuilder::new()`。
#
# Unix 留 rustls。Windows 换 schannel 不是因为它更好，是因为 rustls 拖
# 着 ring，而 ring 要 lib.exe——那东西只在 Visual Studio Build Tools 里，
# 几个 GB 加一次管理员提权。摆在「装个 dct」前面就是劝退。去掉
# ring 之后整棵依赖树一行 C 都没有，rustup 自带的链接器就足够。
# 顺带的好处是走系统证书库，公司里那类中间人代理不用另外配。
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
]

# 标准库不给 Windows 开 AF_UNIX 的口子，这个 crate 补上，形状跟
# `std::os::unix::net` 一样。理由见 `sys::ipc`。
[target.'cfg(windows)'.dependencies.uds_windows]
version = "1.1"
