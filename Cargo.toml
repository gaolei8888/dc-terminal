[package]
name = "dct"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
portable-pty = "0.8"
# 0.15.2 有个真实 bug：滚动偏移一旦超过屏幕行数，读屏幕内容就会
# panic（grid.rs 里 `rows_len - scrollback_offset` 直接减，越界）。
# 0.16 把它改成了 saturating_sub。翻到一屏之外正是这个功能的意义
# 所在，所以不能留在 0.15。
vt100 = "0.16"
ratatui = "0.28"
crossterm = "0.28"
unicode-width = "0.1.14"
libc = "0.2.189"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
