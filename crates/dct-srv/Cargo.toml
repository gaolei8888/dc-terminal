[package]
name = "dct-srv"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
dct-link = { path = "../dct-link" }
# 令牌鉴权（`relay_token::{verify, issue, Claims}`）和 issuer 钥匙（P-256）。
# 只有这个中转需要"验"和"给 token mint 签"，笔记本和手机不该带上这份依赖。
dct-mesh = { path = "../dct-mesh" }
# 手机端那一页网页。**跟 `dct` 发的是同一份字节**——它不住在这两个 crate 的
# 任何一个里面，正是为了让"发两份不一样的网页"这件事需要有人特意去做。
dct-page = { path = "../dct-page" }
# **async 只在这里。** 「不引入 async 运行时」那条规矩是给守护进程和 TUI 写的
# （见 `docs/superpowers/plans/2026-08-10-dct-phone-channel.md`），把它照搬到
# 中转上是刻舟求剑：中转的全部工作就是同时挂着几千条空闲长连接，这正是 async
# 唯一真正不可替代的场景。一个教室 1000 台设备用线程模型就是 1000 条常驻线程。
#
# 这是独立 crate，`cargo tree -p dct` 里看不到 tokio——那条验收在任务 1 里。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# token 只存摘要，不存原文：中转上留着一屋子人的明文钥匙没有任何必要。
sha2 = "0.10"
# 发布密钥由 `dct-srv key add` 当场生成，必须来自系统随机数（同 `dct` 的 getrandom 用法）。
getrandom = "0.2"
# relay-keys 文件（issuer 公钥）和 `token keygen`/`token mint` 落盘的都是 base64。
base64 = "0.22"
# `token keygen`/`token mint` 只在这里签 issuer 令牌，要点名 `dct_mesh::relay_token::issue`
# 要的 `SigningKey` 类型（版本跟 dct-mesh 保持一致）。
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# 只有测试要自己拼 HTTP 请求（见 tests/serves.rs），服务本身用不到读写扩展。
tokio = { version = "1", features = ["io-util"] }
tempfile = "3"
