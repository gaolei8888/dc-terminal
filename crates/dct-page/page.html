<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>dct</title>
<!--
  手机端第 0 期的整个前端。

  规矩三条，改这个文件之前先读：

  1. **一个字的用户可见文案都不许写死在这里。** 全部走 t("key")，键在
     src/web/strings.rs 的 NEEDED 里；那份表由守护进程按当前界面语言填。
     写死的话，`l` 键切语言手机上不跟着变，而且 i18n.rs 那两条守卫查不到它。
     有一条测试会扫这个文件：出现汉字，或者出现任何一句英文文案的字面量，
     就挂。
  2. **没有外部资源。** 没有 CDN、没有字体、没有图。局域网里那台手机可能
     根本没有外网，而一个转着圈加载不出来的页面比朴素的页面糟得多。
  3. **不改 PTY 尺寸。** 手机永远不发 resize（spec 决定四）：画布尺寸归桌面
     那一侧，手机只是在看同一块画布。
-->
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #14161b;
    --dim: #5b6472;
    --line: #d9dde3;
    --accent: #005f87;
    --ok: #2f6f3e;
    --busy: #8a5a00;
    --bad: #a8322a;
  }
  /* 深色那一档写两遍，**不是重复**：
     - `prefers-color-scheme` 管「跟随系统」那一档（没选过就走它）；
     - `[data-theme="dark"]` 管用户在这一页上明确选的那一档，而且要能
       在系统是浅色时**压过**上面那条。
     反过来 `[data-theme="light"]` 也要能在系统是深色时压回浅色，所以
     浅色那一组不能只写在 `:root` 上——它得能再声明一次。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1116;
      --card: #171a20;
      --ink: #e7eaef;
      --dim: #8b95a5;
      --line: #262b34;
      --accent: #63b3d9;
      --ok: #7fc08c;
      --busy: #e8c07d;
      --bad: #e88c7d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1116;
    --card: #171a20;
    --ink: #e7eaef;
    --dim: #8b95a5;
    --line: #262b34;
    --accent: #63b3d9;
    --ok: #7fc08c;
    --busy: #e8c07d;
    --bad: #e88c7d;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #14161b;
    --dim: #5b6472;
    --line: #d9dde3;
    --accent: #005f87;
    --ok: #2f6f3e;
    --busy: #8a5a00;
    --bad: #a8322a;
  }
  * { box-sizing: border-box; }
  /* `hidden` 属性的 display:none 来自浏览器默认样式，而作者样式里**任何**
     一个 display 都比它优先——`main { display: grid }` 就把它顶掉了，于是
     `listEl.hidden = true` 之后列表照样铺在画面下面。这一条把它按回去。
     （这个 bug 是把页面真的打开看了一眼才发现的，DOM 里 hidden 明明是 true。） */
  [hidden] { display: none !important; }
  /* **整页是一个应用外壳，不是一篇会滚的文档。**
     头和底栏定死，中间那块自己滚——原来是 body 在滚、底栏靠 `sticky` 吊着，
     画面一长就把底栏顶出视口，而输入框和那排虚拟键正是这一页最要紧的东西。
     `100dvh` 而不是 `100vh`：手机浏览器的地址栏会伸缩，`vh` 认的是最大那一档，
     于是底栏被挤到屏幕外面去。 */
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
  }
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: .5rem;
    padding: .8rem 1rem;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .01em; }
  /* 断线：**整条标题变红**，跟桌面端断连时那条红色标题条是同一个做法。
     只把小圆点变红是不够的——正在看画面的人眼睛在画面上，而画面本身
     断线前后长得一模一样（它就是最后一帧），不喊一声他不会知道。 */
  header.stale { background: var(--bad); color: var(--bg); border-color: var(--bad); }
  header.stale #dot { background: var(--bg); }
  header.stale .why { font-size: .8rem; font-weight: 400; margin-left: auto; }
  #dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); }
  #dot.off { background: var(--bad); }
  /* 列表和画面都是"中间那块"：占满剩下的高度，自己滚。 */
  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: .75rem; display: grid; gap: .6rem; align-content: start; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: .6rem;
    padding: .75rem .85rem;
    display: grid;
    gap: .3rem;
    /* 整张卡是可点的，指头够得着：44px 是能稳定点中的下限 */
    min-height: 44px;
    cursor: pointer;
  }
  .top { display: flex; align-items: baseline; gap: .5rem; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { margin-left: auto; font-size: .8rem; white-space: nowrap; }
  .state.idle { color: var(--ok); }
  .state.working, .state.asking { color: var(--busy); }
  .state.failed { color: var(--bad); }
  .state.stopped, .state.unknown { color: var(--dim); }
  .project { font-size: .8rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity {
    font-family: var(--mono);
    font-size: .78rem; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .notice { padding: 2rem 1rem; text-align: center; color: var(--dim); }
  .notice.bad { color: var(--bad); }

  /* 会话画面。整块是一张固定宽度的画布——手机不改 PTY 尺寸（spec 决定四），
     所以这里靠字号把它缩到屏幕宽度，缩到看不清就让人自己捏放大。 */
  #screen { flex: 1 1 auto; min-height: 0; position: relative; padding: .5rem; overflow: auto; }
  /* 等宽字体只定义这一次。**尺子必须跟画面用同一套**——尺子是
     `#screen` 的直接子元素、`<pre>` 的兄弟，`#screen pre` 那条选择器
     根本不匹配它，于是它继承 body 的比例字体。拿比例字体量出来的
     「每个字符多宽」偏大（量的还是 M，比例字体里最宽的字母之一），
     光标就越往右偏得越多，`fitFont` 也会把字号挑小、右边空一条。 */
  :root { --mono: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", monospace; }
  #screen pre {
    margin: 0;
    font-family: var(--mono);
    line-height: 1.2;
    white-space: pre;
    /* 画面里的字不参与系统的自动放大：iOS 会把它当正文放大，一行就散了 */
    -webkit-text-size-adjust: none;
    text-size-adjust: none;
  }
  #cursor {
    position: absolute;
    background: var(--ink);
    opacity: .65;
    pointer-events: none;
  }
  #back {
    background: none; border: 0; padding: .1rem .4rem;
    font: inherit; font-size: 1.3rem; line-height: 1;
    color: var(--accent); cursor: pointer;
  }
  .zoom {
    background: none; border: 1px solid var(--line); border-radius: .35rem;
    min-width: 2rem; min-height: 1.8rem;
    font: inherit; font-size: .8rem; line-height: 1;
    color: var(--ink); cursor: pointer;
  }
  .zoom:active { background: var(--line); }
  #zooms { display: flex; gap: .3rem; margin-left: auto; }
  .zoom.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  /* 捕获键盘用的那个输入框：必须**在页面上、能获得焦点**，否则收不到输入法的
     组合事件。所以不是 `display:none`（那样根本聚不了焦），而是缩到看不见。 */
  #capture {
    position: absolute; width: 1px; height: 1px;
    padding: 0; border: 0; outline: 0;
    opacity: 0; pointer-events: none;
  }
  header.stale .zoom { border-color: var(--bg); color: var(--bg); }
  /* 尺子：量「一个字符多宽」。字体必须跟 `#screen pre` 一致，见那边的注释。 */
  #ruler { position: absolute; visibility: hidden; white-space: pre; font-family: var(--mono); }

  /* 输入区：贴在底边，软键盘弹起来时不会被盖住（`position: sticky` 跟着
     视觉视口走，而 `fixed` 在 iOS 上会被键盘顶到看不见的地方）。 */
  /* 底栏**不滚**：它是 flex 的最后一项，定高，永远贴在屏幕底边。 */
  #typing { flex: 0 0 auto; background: var(--bg); border-top: 1px solid var(--line); }
  #keyrow {
    display: flex; gap: .3rem; overflow-x: auto;
    padding: .4rem .5rem; -webkit-overflow-scrolling: touch;
  }
  #keyrow button {
    flex: 0 0 auto;
    min-width: 2.6rem; min-height: 2.2rem;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: .4rem;
    font: inherit; font-size: .85rem;
    cursor: pointer;
  }
  #keyrow button:active { background: var(--line); }
  #keyrow button.held { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  #say { display: flex; gap: .4rem; padding: 0 .5rem .5rem; }
  #say input {
    flex: 1; min-width: 0;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: .4rem;
    padding: .5rem .6rem;
    /* 16px 是 iOS 不自动放大页面的下限——放大之后整块画面的排版就散了 */
    font: inherit; font-size: 16px;
  }
  #say button {
    flex: 0 0 auto; min-width: 3.4rem;
    background: var(--accent); color: var(--bg);
    border: 0; border-radius: .4rem;
    font: inherit; font-size: .9rem; font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
<header id="head">
  <button id="back" type="button" hidden>&lsaquo;</button>
  <span id="dot"></span>
  <h1 id="title"></h1>
  <span id="why" class="why"></span>
  <span id="zooms" hidden>
    <button type="button" class="zoom" id="zoomout">A&minus;</button>
    <button type="button" class="zoom" id="zoomin">A+</button>
    <button type="button" class="zoom" id="kbd">&#9000;</button>
    <button type="button" class="zoom" id="theme" aria-label="theme">&#9681;</button>
  </span>
</header>
<main id="list"></main>
<div id="screen" hidden><span id="ruler">MMMMMMMMMM</span><pre id="canvas"></pre><div id="cursor" hidden></div></div>
<div id="typing" hidden>
  <input id="capture" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1">
  <div id="keyrow"></div>
  <form id="say" autocomplete="off">
    <input id="line" type="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit" id="send">&#9166;</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  // 二维码里的令牌放在 fragment（#t=…），不放查询串：查询串会进浏览器历史、
  // 进任何中间日志，而 fragment 根本不上行。拿到之后立刻换成同源 cookie，
  // 并把地址栏里那一截抹掉——之后每次请求靠 cookie 带，地址可以随便分享。
  //
  // 有效期给 30 天而不是"关掉浏览器就失效"：后者意味着每次重开浏览器都要
  // 重新扫一次码，而扫码要人走到电脑跟前——这个功能本来就是给不在电脑跟前
  // 的人用的。撤销靠换令牌（设置页），不靠 cookie 短命。
  // 经中转的时候码里还带着**要看哪台电脑**（`#d=`），走的是同一条路：
  // 存下来、把地址栏抹干净。
  var CFG = (function claim() {
    function keep(name, value) {
      document.cookie =
        name + "=" + value + "; path=/; max-age=2592000; SameSite=Strict";
    }
    function saved(name) {
      var m = new RegExp("(?:^|; )" + name + "=([^;]*)").exec(document.cookie);
      return m ? m[1] : "";
    }
    function fromHash(key) {
      var m = new RegExp("(?:^|[#&])" + key + "=([^&]+)").exec(location.hash || "");
      return m ? m[1] : "";
    }

    var token = fromHash("t");
    var device = fromHash("d");
    if (token) { keep("dct_web", token); }
    if (device) { keep("dct_device", device); }
    if (token || device) { history.replaceState(null, "", location.pathname); }
    return { token: saved("dct_web"), device: saved("dct_device") };
  })();

  // 文案表。**空表也要能跑**——网络没起来时页面照样显示结构，
  // 只是文字空着，比整页白屏强。
  var S = {};
  function t(key) { return S[key] || ""; }

  var listEl = document.getElementById("list");
  var dotEl = document.getElementById("dot");
  var titleEl = document.getElementById("title");
  var screenEl = document.getElementById("screen");
  var canvasEl = document.getElementById("canvas");
  var rulerEl = document.getElementById("ruler");
  var cursorEl = document.getElementById("cursor");
  var backEl = document.getElementById("back");
  var zoomsEl = document.getElementById("zooms");
  var kbdEl = document.getElementById("kbd");
  var themeEl = document.getElementById("theme");
  var captureEl = document.getElementById("capture");
  var headEl = document.getElementById("head");
  var whyEl = document.getElementById("why");
  var typingEl = document.getElementById("typing");
  var keyrowEl = document.getElementById("keyrow");
  var lineEl = document.getElementById("line");
  var sayEl = document.getElementById("say");

  // 当前在看什么：会话列表，还是某个会话的画面。
  var open = null;   // null = 列表；否则是会话 id

  // ——数据从哪儿来——————————————————————————————————————————————
  //
  // **整页只有 `wire` 这一处知道会话在哪儿、怎么问它。** 底下有两份实现，
  // 上面所有画面、按键、翻历史、输入法的代码一行都不知道自己在用哪一份——
  // 那些正是这一页里最难写对、最不该为了换根管子再动一遍的部分。
  //
  // - `lanWire`：页面是守护进程自己在你的网络上发的，直接问它。
  // - `relayWire`：页面是中转发的，请求要装进信封，中转按信封上的名字送到
  //   你家里那台电脑，再把答复原样带回来。**中转不看信封里的东西。**
  //
  // 两份实现的返回值形状**完全一样**，因为两边最终都是同一个 `Response`
  // ——网页消费的从来就是协议本身（见 `web/routes.rs` 开头）。
  //
  // 两条守卫钉着这件事：`/api/` 只许出现在 `lanWire` 里，`/link/` 只许
  // 出现在 `relayWire` 里。

  function getJson(path) {
    return fetch(path, { credentials: "same-origin" }).then(function (r) {
      if (!r.ok) { throw new Error("http " + r.status); }
      return r.json();
    });
  }

  function postJson(path, body) {
    return fetch(path, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) { throw new Error("http " + r.status); }
    });
  }

  function lanWire() {
    return {
      strings: function (lang) {
        return getJson("/api/strings?lang=" + encodeURIComponent(lang));
      },
      sessions: function () {
        return getJson("/api/sessions");
      },
      screen: function (id) {
        return getJson("/api/screen?id=" + encodeURIComponent(id));
      },
      input: function (id, text) {
        return postJson("/api/input", { id: id, text: text });
      },
      key: function (id, name) {
        return postJson("/api/key", { id: id, key: name });
      },
      scroll: function (id, by) {
        return postJson("/api/scroll", { id: id, by: by });
      }
    };
  }

  // 信封的版本。**必须跟 `dct-link` 的 `LINK_VERSION` 一样**，对不上中转
  // 会当场说 VersionMismatch。有一条守卫盯着这两个数字（在 `dct-srv` 的
  // 测试里，那是唯一同时够得着这一页和那个常量的地方）。
  var LINK_VERSION = 3;

  // payload 是**字节**，不是文本（第二期那里是密文）。所以走 base64，而且
  // 要先按 UTF-8 编码——`btoa` 只认每个码位都小于 256 的字符串，直接喂中文
  // 会当场抛异常。
  function toBase64(text) {
    var bytes = new TextEncoder().encode(text);
    var s = "";
    for (var i = 0; i < bytes.length; i++) { s += String.fromCharCode(bytes[i]); }
    return btoa(s);
  }

  function fromBase64(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
    return new TextDecoder().decode(bytes);
  }

  function relayWire(cfg) {
    var seq = 0;
    // 这一页在中转上叫什么。**每开一次页面换一个名字**：中转是按
    // (谁, seq) 给问题和答复配对的，两个标签页要是同名，它们的 seq 会撞在
    // 一起，撞上那一下等于两个问题共用一个挂号，其中一个永远等不到答复。
    var me = "phone:" + Math.random().toString(36).slice(2, 12);

    function ask(request) {
      seq += 1;
      return fetch("/link/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          auth: {
            version: LINK_VERSION,
            kind: "Phone",
            endpoint: me,
            token: cfg.token
          },
          envelope: {
            from: me,
            to: cfg.device,
            seq: seq,
            payload: toBase64(JSON.stringify(request)),
            recipients: []
          }
        })
      }).then(function (r) {
        if (r.ok) {
          return r.json().then(function (env) {
            return JSON.parse(fromBase64(env.payload));
          });
        }
        // 坏消息带着码回来。**把码留在异常上**，`offline()` 要靠它决定
        // 说哪一句——「你的电脑离线了」和「你的电脑没回话」指向完全不同
        // 的地方，合成一句会把人指去查网络，而问题在他那台机器上。
        return r.json().catch(function () { return {}; }).then(function (body) {
          var e = new Error("link " + r.status);
          e.linkError = body.error || "";
          throw e;
        });
      });
    }

    return {
      strings: function (lang) { return ask({ WebStrings: { lang: lang } }); },
      sessions: function () { return ask("List"); },
      screen: function (id) { return ask({ Screen: { id: id } }); },
      input: function (id, text) { return ask({ Input: { id: id, text: text } }); },
      key: function (id, name) { return ask({ Key: { id: id, name: name } }); },
      scroll: function (id, by) { return ask({ Scroll: { id: id, by: by } }); }
    };
  }

  // 用哪一份，**看地址里有没有一台电脑的名字**。
  //
  // 局域网的码是 `#t=<令牌>`；经中转的码是 `#d=<电脑>&t=<令牌>`。
  //
  // **这是第一期的临时办法。** 任务 5 接上 dc_classroom 之后，选哪台电脑
  // 来自登录之后的设备列表，`#d=` 就该整个消失——别在它上面盖东西。
  var wire = CFG.device ? relayWire(CFG) : lanWire();

  // 协议里的会话状态是一个字符串枚举（SessionState），这里只把它映射到
  // 文案表的键上。**认不出来的一律当 unknown**：编一个状态出来比承认
  // 不知道更糟（同看板上那条「没有 pattern 就显示 —」）。
  function stateKey(state) {
    switch (state) {
      case "Working": return "working";
      case "Asking": return "asking";
      case "Idle": return "idle";
      case "Stopped": return "stopped";
      case "Failed": return "failed";
      default: return "unknown";
    }
  }

  // 项目目录里最后一段。整条路径在手机上一行放不下，而认项目靠的是最后一段。
  function projectOf(dir) {
    var parts = String(dir || "").split(/[\\/]+/).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : "";
  }

  function notice(text, bad) {
    var d = document.createElement("div");
    d.className = bad ? "notice bad" : "notice";
    d.textContent = text;
    return d;
  }

  function card(s) {
    var el = document.createElement("div");
    el.className = "card";
    el.dataset.id = s.id;
    el.addEventListener("click", function () { openSession(s.id, s); });

    var top = document.createElement("div");
    top.className = "top";

    var name = document.createElement("span");
    name.className = "name";
    // 会话没起过名字就退回 profile 名——跟桌面同一条规矩：诚实报一个编号
    // 或者 profile，绝不编一个不存在的名字。
    name.textContent = s.id + " " + (s.tag && s.tag.trim() ? s.tag : s.profile);

    var key = stateKey(s.state);
    var state = document.createElement("span");
    state.className = "state " + key;
    state.textContent = t(key);

    top.appendChild(name);
    top.appendChild(state);

    var project = document.createElement("div");
    project.className = "project";
    project.textContent = projectOf(s.dir);

    el.appendChild(top);
    el.appendChild(project);

    if (s.activity && s.activity.trim()) {
      var act = document.createElement("div");
      act.className = "activity";
      act.textContent = s.activity;
      el.appendChild(act);
    }
    return el;
  }

  function render(sessions) {
    listEl.textContent = "";
    if (!sessions.length) {
      listEl.appendChild(notice(t("empty")));
      return;
    }
    sessions.forEach(function (s) { listEl.appendChild(card(s)); });
  }

  // ——会话画面————————————————————————————————————————————————

  // 256 色索引 → CSS。0–15 是终端自己的十六色（各家主题不一样，这里用一套
  // 常见的取值），16–231 是 6×6×6 色立方，232–255 是灰阶。跟
  // `ui::mod.rs` 里那条对比度守卫算的是同一套公式。
  // ——配色——
  //
  // 三档：跟随系统（默认）、浅、深。选过的存 localStorage，**只存在这台
  // 手机上**：同一个 dct 可能同时被好几个人打开，一个人挑的颜色不该跳到
  // 另一个人的屏幕上，更不该跑回桌面去（桌面那一侧的配色归桌面自己，
  // 同 spec 决定四「手机没有 resize 权」那条道理）。
  var THEMES = ["system", "light", "dark"];
  var themeIdx = 0;
  try {
    var saved = localStorage.getItem("dct-theme");
    if (THEMES.indexOf(saved) > 0) { themeIdx = THEMES.indexOf(saved); }
  } catch (e) {
    // 隐私模式下 localStorage 会抛。选不过是记不住，页面照常能用。
  }

  // 眼下到底是深还是浅。**跟随系统那一档要去问系统**，不能只看属性：
  // 画屏幕那套色号靠它选调色板，看错了整屏字会压在同色背景上。
  function isDark() {
    var t = THEMES[themeIdx];
    if (t === "dark") { return true; }
    if (t === "light") { return false; }
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  var lastLines = null;

  // 重画上一屏。**必须存在**：屏幕那一片 <span> 上钉的是行内 style，
  // 里面是上一套调色板算出来的颜色，光换 CSS 变量动不了它们。
  function repaint() {
    if (lastLines) { paint(lastLines); }
  }

  function applyTheme() {
    var t = THEMES[themeIdx];
    if (t === "system") {
      document.documentElement.removeAttribute("data-theme");
    } else {
      document.documentElement.setAttribute("data-theme", t);
    }
    // 屏幕已经画出来的那一片 <span> 上钉着上一套调色板算出来的颜色，
    // 不重画的话切了主题只有外壳变、正文不变。
    repaint();
  }

  // 系统在「跟随系统」那一档下变了色，也要跟着走。
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onSys = function () { if (THEMES[themeIdx] === "system") { applyTheme(); } };
    if (mq.addEventListener) { mq.addEventListener("change", onSys); }
    else if (mq.addListener) { mq.addListener(onSys); }
  }

  // ANSI 的 0–15 号没有固定的 RGB——终端主题自己定。这里要两套，因为
  // **同一套色号在深底和浅底上不可能都读得清**：经典 xterm 那套是为黑底
  // 配的，把它压在白底上，11 号亮黄（#ffff00）和 15 号白（#ffffff）直接
  // 隐形；反过来浅底那套压在黑底上，0 号黑也一样看不见。
  //
  // 浅底那套里 7/15 号**故意不是白色**：在黑底终端上它们是默认前景（也就是
  // 正文），照字面画成白色的话，一屏正文在白底上全部消失。所有「亮」色也
  // 相应压暗——亮色在浅底上的作用是「更重」，不是「更亮」。
  var PALETTE = {
    dark: [
      "#000000", "#cd0000", "#00cd00", "#cdcd00",
      "#0000ee", "#cd00cd", "#00cdcd", "#e5e5e5",
      "#7f7f7f", "#ff0000", "#00ff00", "#ffff00",
      "#5c5cff", "#ff00ff", "#00ffff", "#ffffff"
    ],
    light: [
      "#2b2f36", "#a8322a", "#2f6f3e", "#8a5a00",
      "#005f87", "#8b3a8b", "#16697a", "#3a3f4a",
      "#5b6472", "#c0392b", "#3d8b50", "#a06a00",
      "#0a6f9c", "#a34aa3", "#1c7f92", "#14161b"
    ]
  };
  function idxColor(i) {
    var base = PALETTE[isDark() ? "dark" : "light"];
    if (i < 16) { return base[i]; }
    if (i >= 232) {
      var v = 8 + 10 * (i - 232);
      return "rgb(" + v + "," + v + "," + v + ")";
    }
    var STEP = [0, 95, 135, 175, 215, 255];
    var n = i - 16;
    return "rgb(" + STEP[Math.floor(n / 36)] + "," +
      STEP[Math.floor((n % 36) / 6)] + "," + STEP[n % 6] + ")";
  }

  // 协议里的颜色是三选一：字符串 "Default"、{Idx:n}、{Rgb:[r,g,b]}。
  //
  // **判 Idx 必须用 typeof，不能用真值判断**：0 号色是黑色，而 `if (c.Idx)`
  // 对 0 是假的——一整屏的黑字会被当成"没上色"。
  function cssColor(c) {
    if (!c || c === "Default") { return null; }
    if (typeof c.Idx === "number") { return idxColor(c.Idx); }
    if (c.Rgb) { return "rgb(" + c.Rgb.join(",") + ")"; }
    return null;
  }

  function styleOf(st) {
    if (!st) { return ""; }
    var fg = cssColor(st.fg);
    var bg = cssColor(st.bg);
    // 反显 = 前景背景对调。哪一边本来没有具体颜色，就拿页面自己的那一档补上——
    // 不补的话，一屏默认色上的"反显"什么都看不出来（而反显正是 dct 自己用来
    // 标"当前项目"的手法）。
    if (st.inverse) {
      var swapped = [bg || "var(--bg)", fg || "var(--ink)"];
      fg = swapped[0];
      bg = swapped[1];
    }
    var out = "";
    if (fg) { out += "color:" + fg + ";"; }
    if (bg) { out += "background:" + bg + ";"; }
    if (st.bold) { out += "font-weight:600;"; }
    if (st.italic) { out += "font-style:italic;"; }
    if (st.underline) { out += "text-decoration:underline;"; }
    return out;
  }

  // 一整屏画成 <pre> 里的一串 <span>。**用 textContent 塞字**，
  // 不拼 HTML 字符串——屏幕上的内容来自 agent，里面什么字节都可能有。
  function paint(lines) {
    canvasEl.textContent = "";
    var cols = 0;
    lines.forEach(function (spans, row) {
      var width = 0;
      // **每一行套一个 `<span class="row">`。** 点一行要把这一行的字取出来，
      // 而原来所有 span 是平铺的，点中之后无从知道自己落在第几行。
      // 换行符仍然留在行外面：`pageStep()` 靠 `canvasEl.textContent` 数行数，
      // 把 `\n` 收进行里会让那个数字变，而它管的是翻页步长。
      var line = document.createElement("span");
      line.className = "row";
      spans.forEach(function (sp) {
        var el = document.createElement("span");
        var css = styleOf(sp.style);
        if (css) { el.setAttribute("style", css); }
        el.textContent = sp.text;
        width += sp.text.length;
        line.appendChild(el);
      });
      canvasEl.appendChild(line);
      if (width > cols) { cols = width; }
      if (row < lines.length - 1) {
        canvasEl.appendChild(document.createTextNode("\n"));
      }
    });
    return cols;
  }

  // 用户自己调过的倍数。1 = 完全按屏幕自动适配。
  //
  // 记在 localStorage 里：把字号调舒服是一次性的动作，每次打开都要重调一遍
  // 的话，这个功能就等于没有。读写都包 try——隐私模式下 localStorage 会直接
  // 抛异常，而"存不下偏好"绝不该让整页白屏。
  var zoom = 1;
  try {
    var saved = parseFloat(localStorage.getItem("dct-zoom"));
    if (saved > 0.3 && saved < 4) { zoom = saved; }
  } catch (e) {}

  function setZoom(z) {
    zoom = Math.max(0.5, Math.min(3, z));
    try { localStorage.setItem("dct-zoom", String(zoom)); } catch (e) {}
    fitFont(lastCols, lastRows);
    placeCursor(lastCursor, lastCursorHidden);
  }

  // 把整块画布**按宽和高一起**缩进屏幕里。
  //
  // 原来只按宽度算，于是竖屏上一行放得下、24 行却装不下——而画面是一整块
  // 固定尺寸的画布（手机不改 PTY 尺寸，spec 决定四），少看的那几行就是
  // agent 此刻正在写的那几行。两个方向各算一个上限，取小的那个。
  //
  // 6px 封底：再小不是"小"，是"看不见"。上限 28px 是给调大的人留的余地——
  // 超出屏幕的部分由 `#screen` 自己滚（底栏不动，它在 flex 外面）。
  var lastCols = 0, lastRows = 0, lastCursor = null, lastCursorHidden = true;

  function fitFont(cols, rows) {
    if (!cols || !rows) { return; }
    var probe = 16;
    rulerEl.style.fontSize = probe + "px";
    var per = rulerEl.getBoundingClientRect().width / 10;
    if (!per) { return; }

    var padding = 16;
    var byWidth = ((screenEl.clientWidth - padding) / (cols * per)) * probe;
    // 行高是 1.2（见 `#screen pre` 的 CSS），高度这一侧要按它折算。
    var byHeight = (screenEl.clientHeight - padding) / (rows * 1.2);
    var size = Math.floor(Math.min(byWidth, byHeight) * zoom);
    canvasEl.style.fontSize = Math.max(6, Math.min(28, size)) + "px";
  }

  function placeCursor(pos, hidden) {
    if (hidden || !pos) { cursorEl.hidden = true; return; }
    var size = parseFloat(canvasEl.style.fontSize) || 16;
    rulerEl.style.fontSize = size + "px";
    var per = rulerEl.getBoundingClientRect().width / 10;
    var lineH = size * 1.2;
    cursorEl.hidden = false;
    cursorEl.style.width = per + "px";
    cursorEl.style.height = lineH + "px";
    cursorEl.style.left = (8 + pos[1] * per) + "px";
    cursorEl.style.top = (8 + pos[0] * lineH) + "px";
  }

  function drawScreen(resp) {
    if (!resp || !resp.Screen) { throw new Error("unexpected response"); }
    var s = resp.Screen;
    var lines = s.lines || [];
    // 留一份：切配色要拿它原样重画一遍（`repaint`）。存的是协议里的
    // 颜色（"Default"/{Idx}/{Rgb}），不是算好的 CSS，所以换调色板之后
    // 重算出来的就是新那套。
    lastLines = lines;
    var cols = paint(lines);
    lastCols = cols;
    lastRows = lines.length;
    lastCursor = s.cursor;
    lastCursorHidden = s.cursor_hidden;
    fitFont(cols, lines.length);
    // `cursor_hidden` 为真时一定不画。agent 干活时把光标关掉，而那个坐标
    // 还在满屏乱跑——照着画就是一个到处蹦的方块（桌面端踩过这个坑）。
    placeCursor(s.cursor, s.cursor_hidden);
    // 翻历史那两个键要不要露面，看这一帧的滚动状态（`max`/`offset`）——
    // 没有历史可翻的时候不写，屏幕上不许出现按了没反应的东西。
    scrollState = s.scroll || {};
    updateHistoryKeys(scrollState);
    online();
  }

  // ——打字————————————————————————————————————————————————————————

  // 往会话里送完东西之后，总要做的那两件事。**怎么送在 `wire` 里，这里
  // 只管送完。** 分开是因为换根管子只该换前者。
  //
  // 敲完立刻拉一帧：不等下一个 300ms 的话，手机上按下去到看见反应之间会有
  // 小半秒的空档，那半秒里人会以为没按上，然后再按一次。
  //
  // **但连着敲的时候只补最后那一帧。** 捕获模式下每一个字符都是一次
  // `input` 事件、一次发送（见 `flushCapture`），一路直连 `tick()` 的话，
  // 打一行字就是几十次整屏拉取加几十次整片 DOM 重建。人眼要的是"停下来
  // 那一刻屏幕是对的"，不是每个字符都对一次。
  function sent(p) {
    return p.then(nudge).catch(offline);
  }

  // 「现在能不能往会话里送东西」**只有这一处说了算**。
  //
  // 两件事都得成立：得有一个打开着的会话，而且**输入法不在组合中**。
  // 组合期送出去的话，敲进 agent 的是拼音本身而不是汉字——而这件事在
  // 英文键盘上永远试不出来。抄成好几处的话，漏改的那一处就是"某个按钮
  // 在打拼音的时候把半截字送了出去"。有一条守卫钉着这个唯一性。
  function canSend() {
    return open !== null && !composing;
  }

  function sendKey(name) {
    if (!canSend()) { return; }
    return sent(wire.key(open, name));
  }

  // 翻历史。**不是往会话里敲 PageUp**：桌面端那两个键在 dct 自己攥着历史时
  // 是被 dct 吃掉的（`attach::key_scroll`），根本不到 agent 那儿。
  // 眼下这一屏的滚动事实（`ScrollState`）：`agent_owns` / `max` / `offset`。
  // `drawScreen` 每帧更新它，路由要靠它。
  var scrollState = {};

  // **翻历史该走哪条路，桌面已经定过了，这里照抄那份判断。**
  //
  // 桌面：`attach::wheel_action` 和 `attach::key_scroll`——
  //   - `offset > 0` 时 End 永远由 dct 兑现（底栏敢写就必须能按）；
  //   - `agent_owns` 为真（Claude Code 这类自己管视口的 agent）→ 不拦，
  //     翻页键原样送给 agent，滚的是它自己的历史；
  //   - `max == 0`（备用屏上没有历史）→ 同样送给 agent，当普通编辑键。
  //   - 其余才是 dct 滚自己的缓冲。
  //
  // 手机原来只实现了最后那一档，于是在 Claude Code 会话上 ⇞⇟ 整个消失、
  // 什么也翻不动——而同一个会话在桌面上是翻得动的。两边不一样，正是这条
  // 链路最不该出现的东西。
  //
  // 这份判断跟 `attach.rs` 那两个函数是**同一条规则的两处实现**，改一处就
  // 要改另一处；之所以不能只留一处，是因为路由必须在客户端做——服务端
  // 不知道用户按的是"翻历史"还是"给 agent 发 PageUp"。
  function scrollGoesToAgent(kind) {
    if (kind === "bottom") {
      // offset > 0 就是 dct 自己欠的账，不管此刻鼠标归谁都由 dct 兑现。
      return !(scrollState.offset > 0);
    }
    return scrollState.agent_owns || !(scrollState.max > 0);
  }

  // `kind` 是「用户想干什么」（up/down/bottom），`by` 是走 dct 那条路时的参数。
  // 送给 agent 那条路用的是键名——同一个意图的两种表达。
  var AGENT_KEY = { up: "PageUp", down: "PageDown", bottom: "End" };

  function scroll(kind, by) {
    if (!canSend()) { return; }
    if (scrollGoesToAgent(kind)) {
      return sent(wire.key(open, AGENT_KEY[kind]));
    }
    return sent(wire.scroll(open, by));
  }

  // 一屏减两行——跟桌面端翻页的步长同一个算法（留两行接上上一屏，
  // 不然翻完不知道自己翻到哪儿了）。
  function pageStep() {
    var rows = canvasEl.textContent.split("\n").length;
    return Math.max(1, rows - 2);
  }

  // 虚拟键行。手机键盘上没有这些键，而 agent 全都要用：Esc 关弹窗、
  // Tab 切模式、方向键选菜单、Ctrl+C 打断。
  //
  // 名字必须跟 `web::keys::NAMES` 对得上（外加 `Ctrl+` 那一档）——有一条
  // 测试拿那张白名单来对这一排，多一个手机上按不动的键就挂。
  var ROW = ["Esc", "Tab", "Up", "Down", "Left", "Right", "Ctrl+C"];

  // `Ctrl` 单独一个粘滞键：手机上没法"按住 Ctrl 再按 C"，所以按一下 Ctrl
  // 亮起来，下一个字母跟它合成 `Ctrl+X`，然后自动灭掉。只放一个 Ctrl+C
  // 的话，Ctrl+D（结束输入）、Ctrl+U（清行）在手机上就永远按不出来。
  var ctrlHeld = false;
  var composing = false;

  // 翻历史那三个键。**跟上面那一排分开**：它们不是按键，是
  // `Request::Scroll`（见 `scroll()`），而且**只在真的有历史可翻时才露面**
  // ——屏幕上不许出现按了没反应的东西。
  var HISTORY = [
    { name: "up", label: "⇞", act: function () { scroll("up", { Rows: pageStep() }); } },
    { name: "down", label: "⇟", act: function () { scroll("down", { Rows: -pageStep() }); } },
    { name: "bottom", label: "⤓", act: function () { scroll("bottom", "Bottom"); } }
  ];

  // 哪几个该露面，由这一帧的滚动状态说了算：
  // 没有历史（`max` 为 0）三个都不写；在底部时只有「往上」有意义。
  function updateHistoryKeys(st) {
    var max = st.max || 0;
    var offset = st.offset || 0;
    // agent 自己管视口的时候，dct 这边的 `max`/`offset` 恒为 0——但翻页
    // **是有用的**，只不过翻的是 agent 自己的历史（`scroll()` 会把键送
    // 过去）。照 max 判就等于在 Claude Code 会话上把这三个键全藏起来，
    // 而桌面上它们是能按的。
    var toAgent = st.agent_owns;
    var show = {
      up: toAgent || (max > 0 && offset < max),
      down: toAgent || offset > 0,
      // 回到底部只在真的滚上去过的时候才有意义；agent 自己管视口时
      // 「底部」归它自己定义，dct 没有可兑现的账。
      bottom: offset > 0
    };
    Array.prototype.forEach.call(
      keyrowEl.querySelectorAll("button[data-history]"),
      function (b) { b.hidden = !show[b.dataset.history]; }
    );
  }

  function buildKeyRow() {
    keyrowEl.textContent = "";
    ROW.forEach(function (name) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = name === "Up" ? "↑" : name === "Down" ? "↓"
        : name === "Left" ? "←" : name === "Right" ? "→" : name;
      b.addEventListener("click", function () { sendKey(name); });
      keyrowEl.appendChild(b);
    });

    HISTORY.forEach(function (h) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = h.label;
      b.dataset.history = h.name;
      b.hidden = true;
      b.addEventListener("click", h.act);
      keyrowEl.appendChild(b);
    });

    var ctrl = document.createElement("button");
    ctrl.type = "button";
    ctrl.textContent = "Ctrl";
    ctrl.addEventListener("click", function () {
      ctrlHeld = !ctrlHeld;
      ctrl.className = ctrlHeld ? "held" : "";
      lineEl.focus();
    });
    keyrowEl.appendChild(ctrl);
    return ctrl;
  }
  var ctrlBtn = buildKeyRow();

  function releaseCtrl() {
    ctrlHeld = false;
    ctrlBtn.className = "";
  }

  // 粘滞 Ctrl 亮着的时候，输入框里打的第一个字母变成 Ctrl+它。
  lineEl.addEventListener("keydown", function (e) {
    // 组合期一个字节都不上送——`canSend` 是那条唯一的判断。
    if (!ctrlHeld || !canSend()) { return; }
    if (e.key && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
      e.preventDefault();
      sendKey("Ctrl+" + e.key.toUpperCase());
      releaseCtrl();
    }
  });

  // 中文输入法：组合期间一个字节都不上送。逐字符转发会把拼音本身敲进 agent。
  // **两个输入口共用这一个标志**（单行框和捕获键盘用的那个隐藏框），
  // 因为「在不在组合中」是一件事，不是两件。
  lineEl.addEventListener("compositionstart", function () { composing = true; });
  lineEl.addEventListener("compositionend", function () { composing = false; });

  sayEl.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!canSend()) { return; }
    var text = lineEl.value;
    lineEl.value = "";
    // 两步，顺序不能反也不能合：先把文字写进去，再单独送一次空回车——
    // **空的那一次才打检查点**，才让 agent 真的开始干这一轮
    // （同 SessionWriter::type_into 的约定）。合成一步的话，手机上发出去的
    // 每一句话都没有检查点，`u` 撤不回来。
    var typed = text ? sent(wire.input(open, text)) : Promise.resolve();
    typed.then(function () { return sendKey("Enter"); });
  });

  function openSession(id, info) {
    open = id;
    listEl.hidden = true;
    screenEl.hidden = false;
    backEl.hidden = false;
    typingEl.hidden = false;
    zoomsEl.hidden = false;
    if (info) {
      titleEl.textContent = id + " " + (info.tag && info.tag.trim() ? info.tag : info.profile);
    }
    tick();
  }

  function closeSession() {
    open = null;
    screenEl.hidden = true;
    typingEl.hidden = true;
    releaseCtrl();
    cursorEl.hidden = true;
    listEl.hidden = false;
    backEl.hidden = true;
    zoomsEl.hidden = true;
    setCapture(false);
    titleEl.textContent = t("title");
    tick();
  }

  backEl.addEventListener("click", closeSession);

  // 断线。**看着画面的人也得知道**：画面本身断线前后长得一模一样（它就是
  // 最后一帧），只在列表上写一句话的话，正在看某个会话的人什么都不会发现，
  // 然后对着一屏早就过期的内容做判断。所以标题整条变红并写明原因——
  // 跟桌面端断连时那条红标题是同一个做法。
  // **中转能分清两种断法，局域网分不清。**
  //
  // `Offline` = 你的电脑根本没在问中转要东西（关机了、dct 没跑、那头断网）。
  // `NoAnswer` = 信封送到了，它没回话（多半是刚睡过去，或者 dct 卡住了）。
  //
  // 两句话让人去看的地方完全不同：一句是"去开机/去开 dct"，一句是"去动一下
  // 那台电脑"。合成一句的话，一台睡着的电脑会把人指去查网络。
  //
  // 局域网那条路上没有这个信息（连不上就是连不上），仍旧用原来那句合起来
  // 说的话。
  function offline(err) {
    var code = (err && err.linkError) || "";
    var key = code === "Offline" ? "gone" : code === "NoAnswer" ? "silent" : "offline";
    dotEl.className = "off";
    headEl.className = "stale";
    whyEl.textContent = t(key);
    if (open === null) {
      listEl.textContent = "";
      listEl.appendChild(notice(t(key), true));
    }
  }

  function online() {
    dotEl.className = "";
    headEl.className = "";
    whyEl.textContent = "";
  }

  function refreshList() {
    return wire.sessions().then(function (resp) {
      // 协议的答复是一个 externally tagged 的枚举：{"Sessions": [...]}。
      // 别的形状（比如 {"Error": …}）当成「这一轮没拿到」，不硬解。
      if (!resp || !resp.Sessions) { throw new Error("unexpected response"); }
      online();
      render(resp.Sessions);
    }).catch(offline);
  }

  // **一次只飞一个 `/api/screen`。**
  //
  // 没有这道闸的时候：300ms 的定时器照发，而每敲一个字 `post()` 又追加
  // 一帧（见它上面那段注释）。手机上打字 5 个字符每秒，就是每秒八九个
  // 整屏请求，每个回来都要把整片 <pre> 拆了重建（`paint`）再量一次字号
  // （`fitFont`）。链路一慢（WiFi 差、daemon 忙），单个请求超过 300ms，
  // 后面的就开始叠——越慢越叠，越叠越慢。用户看到的就是"打了字之后整个
  // 会话卡住"。
  //
  // 闸门期间来的请求不排队，只记一个「还欠一帧」：屏幕是**当前状态**，
  // 补三帧陈旧的没有意义，补最后一帧才有。
  var screenInflight = false;
  var screenDue = false;

  function refreshScreen(id) {
    if (screenInflight) {
      screenDue = true;
      return Promise.resolve();
    }
    screenInflight = true;
    return wire.screen(id)
      .then(drawScreen)
      .catch(offline)
      .then(function () {
        screenInflight = false;
        if (screenDue) {
          screenDue = false;
          // 欠的那一帧补在下一轮事件循环里，不在这里直接递归——
          // 链路一直慢的话，直接递归就是一条永不落地的调用链。
          if (open !== null && shouldPoll()) { setTimeout(function () { refreshScreen(open); }, 0); }
        }
      });
  }

  // 一个定时器管两种画面，节奏不一样：
  //
  // - 画面 300ms 一帧。桌面端是 16ms，那是本地 socket 的节奏；这一条链路上
  //   16ms 是白烧电池和带宽，而 300ms 已经跟得上人读屏幕的速度（spec 的「流控」）。
  // - 列表 3 秒一次。它只是几行状态，更快没有意义。
  //
  // **只在前台跑。** 手机锁屏之后一帧都不该发——人在兜里揣着，dct 在家里
  // 每秒被问三次。`document.visibilityState` 是这件事唯一可靠的信号。
  var SCREEN_MS = 300;
  var LIST_EVERY = 10;   // 10 × 300ms = 3s
  var timer = null;
  var ticks = 0;

  // 「现在该不该发请求」**只有这一处说了算**。
  //
  // 抄成三处（定时器里一处、进画面时一处、切回前台时一处）的话，将来漏改
  // 其中一处的症状是"手机锁着屏，dct 在家里每秒被问三次"——而这件事在手机上
  // 完全看不出来，只会体现在电池和流量上。有一条守卫钉着这个唯一性。
  function shouldPoll() {
    return document.visibilityState === "visible";
  }

  // 打字之后那一帧：**合并**。40ms 内连着敲的字共用同一帧。
  // 这个数字挑得比人的连击间隔小、比一次往返大——比它小就退回一字一帧，
  // 比它大人就会觉得"敲下去没反应"。
  var nudgeTimer = null;
  function nudge() {
    if (nudgeTimer) { return; }
    nudgeTimer = setTimeout(function () {
      nudgeTimer = null;
      tick();
    }, 40);
  }

  function tick() {
    if (!shouldPoll()) { return; }
    if (open !== null) { refreshScreen(open); return; }
    refreshList();
  }

  function start() {
    if (timer) { return; }
    tick();
    timer = setInterval(function () {
      if (!shouldPoll()) { return; }
      ticks++;
      if (open !== null) { refreshScreen(open); }
      else if (ticks % LIST_EVERY === 0) { refreshList(); }
    }, SCREEN_MS);
  }

  document.addEventListener("visibilitychange", tick);

  // 转屏、软键盘弹起收起，可用高度都会变——不重算的话，横过来那一下
  // 画面还按竖屏的字号画着，屏幕右边空一大块。
  window.addEventListener("resize", function () {
    fitFont(lastCols, lastRows);
    placeCursor(lastCursor, lastCursorHidden);
  });

  // ——用键盘打字（实体键盘）————————————————————————————————————

  // 物理按键 → 这一页已经在用的那套名字（`web::keys::NAMES`）。
  //
  // **`PageUp`/`PageDown`/`End` 不在这儿**，是故意的：桌面端 dct 自己会把
  // 它们吃掉去翻滚屏（`attach::key_scroll`），送给 agent 就成了「同一个键
  // 两个客户端两种行为」。它们走下面 `SCROLLS_INSTEAD` 那一档，跟 ⇞⇟⤓
  // 三个按钮是同一条路（`/api/scroll`）——**桌面吃掉之后走的也正是这条**。
  var KEYNAMES = {
    Escape: "Esc",
    Tab: "Tab",
    Enter: "Enter",
    Backspace: "Backspace",
    Delete: "Delete",
    ArrowUp: "Up",
    ArrowDown: "Down",
    ArrowLeft: "Left",
    ArrowRight: "Right",
    Home: "Home"
  };

  // 这几个键在桌面上是「翻 dct 的历史」，不是敲给 agent 的。
  // 实体键盘上那三个键。**它们不进 `KEYNAMES`**：意图是「翻历史」，
  // 而翻历史该走哪条路由 `scroll()` 决定——`agent_owns` 为真时它自己会把
  // 键送给 agent，跟桌面一样。名字在这里只是「哪一种翻法」。
  var SCROLLS_INSTEAD = {
    PageUp: function () { return ["up", { Rows: pageStep() }]; },
    PageDown: function () { return ["down", { Rows: -pageStep() }]; },
    End: function () { return ["bottom", "Bottom"]; }
  };

  var capturing = false;

  function setCapture(on) {
    capturing = on;
    kbdEl.className = on ? "zoom on" : "zoom";
    // 捕获开着时那个单行框没有意义了——键盘直通会话，不再需要"先攒一句再发"。
    sayEl.hidden = on;
    if (on) {
      captureEl.focus();
    } else {
      captureEl.blur();
    }
  }

  // 组合期一个字节都不上送——判断还是那一处 `canSend()`，这里只是把
  // 组合状态喂给它。
  captureEl.addEventListener("compositionstart", function () { composing = true; });
  captureEl.addEventListener("compositionend", function () {
    composing = false;
    flushCapture();
  });

  // 普通字符走 `input` 事件，不走 `keydown`：`keydown` 上的 `e.key` 对
  // 输入法、对带修饰的布局都不可靠，而 `input` 给的是**真正落下去的那些字**。
  captureEl.addEventListener("input", flushCapture);

  // **先问能不能送，再取值。** 反过来的话，组合期那一下会把输入框清空——
  // 用户正在打的拼音当场消失，而他什么都没做错。
  function flushCapture() {
    if (!canSend()) { return; }
    var text = captureEl.value;
    if (!text) { return; }
    captureEl.value = "";
    sent(wire.input(open, text));
  }

  document.addEventListener("keydown", function (e) {
    if (!capturing || !canSend()) { return; }

    // 翻历史那三个键：走滚动，不当按键发下去（见 SCROLLS_INSTEAD 上面那段）。
    var by = SCROLLS_INSTEAD[e.key];
    if (by && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      var args = by();
      scroll(args[0], args[1]);
      return;
    }

    // Ctrl+字母。**放在具名键前面判**：`Ctrl+C` 的 `e.key` 就是 `"c"`，
    // 不先看修饰键的话它会被当成一个普通字符落进输入框。
    if (e.ctrlKey && !e.altKey && !e.metaKey && /^[a-zA-Z]$/.test(e.key)) {
      e.preventDefault();
      sendKey("Ctrl+" + e.key.toUpperCase());
      return;
    }

    var name = KEYNAMES[e.key];
    if (name) {
      e.preventDefault();
      sendKey(name);
    }
    // 其余的一概不拦：普通字符由 `input` 事件收，浏览器自己的快捷键
    // （切标签页、刷新）留给浏览器——否则用户会被关在这一页里出不去。
  });

  // ——点一行，把它放进输入框——
  //
  // 手机上没有桌面那个 `F4` 复制模式，长按选中在真机上也不好使，于是
  // 「把屏幕上的字弄进输入框」原本无路可走——而这正是最常要做的一件事：
  // agent 打了一条命令或一个建议出来，人想拿过来改一改再发回去。
  //
  // **只认真正的「点」，不认滑动。** 画面区自己要滚，手指一划就取消——
  // 不判这一下的话，每次滚动都会往输入框里塞一行。
  var tapFrom = null;
  var tapCancelled = false;
  canvasEl.addEventListener("touchstart", function (e) {
    var t = e.touches[0];
    tapFrom = t ? { x: t.clientX, y: t.clientY } : null;
    tapCancelled = false;
  }, { passive: true });
  canvasEl.addEventListener("touchmove", function (e) {
    if (!tapFrom || tapCancelled) { return; }
    var t = e.touches[0];
    if (!t) { return; }
    // 10px 是「手指按住不动也会抖一点」和「这是一次滑动」之间的界线。
    if (Math.abs(t.clientX - tapFrom.x) > 10 || Math.abs(t.clientY - tapFrom.y) > 10) {
      tapCancelled = true;
    }
  }, { passive: true });

  canvasEl.addEventListener("click", function (e) {
    // 滑动过就不算点。鼠标点（桌面浏览器调试用）根本不产生 touch 事件，
    // `tapCancelled` 一直是 false，照常放行。
    if (tapCancelled) { tapCancelled = false; return; }
    var row = e.target && e.target.closest ? e.target.closest(".row") : null;
    if (!row || !lineEl) { return; }
    // 终端每一行都补足了宽度，右边一大片空格；不裁掉的话输入框里全是空白。
    var text = row.textContent.replace(/\s+$/, "");
    if (!text) { return; }
    // **往后接，不覆盖。** 输入框里已经打了字的时候覆盖掉就是把人的活儿
    // 弄丢了，而接在后面最坏也只是多一段可以删掉的字。空框时接=放进去，
    // 一条规则管两种情况。
    var cur = lineEl.value;
    lineEl.value = cur && !/\s$/.test(cur) ? cur + " " + text : cur + text;
    lineEl.focus();
    // 光标放到末尾：接进来就是为了在后面接着改。
    try { lineEl.setSelectionRange(lineEl.value.length, lineEl.value.length); } catch (err) { /* 某些输入类型不支持 */ }
  });

  kbdEl.addEventListener("click", function () { setCapture(!capturing); });

  // 按一下换下一档：跟随系统 → 浅 → 深 → 跟随系统。三档轮转而不是
  // 两档开关，是因为「跟随系统」得是能回得去的一档——手机在傍晚自己
  // 变深色，用户多半希望这一页也跟着变。
  themeEl.addEventListener("click", function () {
    themeIdx = (themeIdx + 1) % THEMES.length;
    try {
      localStorage.setItem("dct-theme", THEMES[themeIdx]);
    } catch (e) {
      // 记不住就算了，这一次的选择照样生效。
    }
    applyTheme();
  });

  applyTheme();

  document.getElementById("zoomout").addEventListener("click", function () {
    setZoom(zoom / 1.15);
  });
  document.getElementById("zoomin").addEventListener("click", function () {
    setZoom(zoom * 1.15);
  });

  // 先取文案再取列表：文案空着的时候「还没有会话」会显示成一片空白，
  // 用户会以为页面坏了。取不到就用空表继续——结构照样在。
  wire.strings(navigator.language || "")
    // 文案现在跟别的东西一样是协议的答复：{"Strings": {...}}。别的形状
    // （比如 {"Error": …}）当成拿不到，用空表继续——结构照样在。
    .then(function (resp) { S = (resp && resp.Strings) || {}; })
    .catch(function () { S = {}; })
    .then(function () {
      titleEl.textContent = t("title");
      document.title = t("title") || "dct";
      // 图标按钮也要有名字：读屏软件念不出「A−」。
      document.getElementById("zoomout").setAttribute("aria-label", t("smaller"));
      document.getElementById("zoomin").setAttribute("aria-label", t("bigger"));
      backEl.setAttribute("aria-label", t("back"));
      kbdEl.setAttribute("aria-label", t("keyboard"));
      // 输入框的提示语兼这条功能的说明书：点一行能把它放进来这件事
      // 没有任何别的地方写着，不写就等于没做（屏幕上不许有猜出来的功能）。
      lineEl.setAttribute("placeholder", t("tapline"));
      start();
    });
})();
</script>
</body>
</html>
