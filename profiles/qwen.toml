name = "qwen"
# `--approval-mode=yolo`：不带它，agent 每要动一个文件、跑一条命令都会停下来
# 等人点头，而 dct 的整个前提是「它从来不问这样可以吗」——那份底气来自每轮
# 之前的隐藏快照，不是来自逐条确认。README 那句「command 里记得带上这个
# agent 自己的权限绕过参数」说的就是这里，而这个 profile 一直漏着它。
#
# 写 `--approval-mode=yolo` 而不是 `--yolo`：两个都还能用，但 Qwen Code
# 自己的文档说前者是取代后者的新写法（"Use `--approval-mode=yolo` instead
# of `--yolo` for the new unified approach"），而且两个同时给会直接报错。
# 实测于 qwen-code 0.22.2。
command = ["qwen", "--approval-mode=yolo"]
is_agent = true
# 两个 pattern 仍然不填：TUI 没实测过，编一个假的会让正在干活的会话在看板上
# 显示成空闲。状态显示「—」是承认不知道。
# 跟 dc.toml 用同一把钥匙、同一个网关（见下面 [secret.hint] 那句），先点
# Qwen Code 的学生不该撞上粘贴框——见 profile.rs::Profile::pairable。
pairable = true

[label]
zh = "Qwen Code"
en = "Qwen Code"

[note]
zh = "通义千问，走训练营网关"
en = "Alibaba Qwen, through the camp gateway"

[install]
command = ["npm", "i", "-g", "@qwen-code/qwen-code"]

[install.note]
zh = "需要先装 Node.js"
en = "Requires Node.js"

# 这个 profile 是 OpenAI 方言那一侧的入口，和 `dc.toml` 互补。
#
# Claude Code 只说 Anthropic 方言，而我们自己的 GPU 上跑的模型说 OpenAI 方言，
# 中间没有翻译——所以在 Claude Code 里选千问会撞上网关的 404（见
# `upstream.py` 里 `/v1/messages` 只交给 anthropic 类型的 provider 那段）。
# Qwen Code 本身就说 OpenAI 方言，网关的 `/v1/chat/completions` 原生服务这一侧，
# 于是同一把钥匙在这里能用到自有算力，不需要任何翻译工作。
#
# **实测于 qwen-code 0.22.3**：这三个变量名是从安装包里数出来的引用
# （OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL），不是照文档抄的；
# 设上之后请求确实落在网关的 `/v1/chat/completions` 上，带的是网关自己的
# key。**没有实测的是一次成功的回答**——那取决于网关上游当时通不通，与这个
# profile 无关。
[env]
OPENAI_BASE_URL = "https://dc-llm.tzspace.cn/v1"
# 带 `/v1`：这个 CLI 把 base_url 当成 API 根，后面自己接 `/chat/completions`。
# 实测里正是这样落到网关上的。

[secret]
env = "OPENAI_API_KEY"
url = "https://dc-llm.tzspace.cn/me"

[secret.hint]
zh = "跟 DC 用同一把钥匙，在 dc-llm.tzspace.cn 的个人空间里复制"
en = "The same key as DC — copy it from your account page at dc-llm.tzspace.cn"

# 指向 chat/completions 而不是 messages：校验只看状态码，有效的 key 会因为
# 探测请求里那个假模型名换回 400（放行），无效的 key 换回 401（判坏）。
# 见 `verify.rs::verify_with`。
[secret.verify]
url = "https://dc-llm.tzspace.cn/v1/chat/completions"

[api]
base_url = "https://dc-llm.tzspace.cn/v1"
wire = "openai"
