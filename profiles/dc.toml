name = "dc"
# 使用已验证的 Qwen 启动参数；屏幕状态和恢复参数尚未验证，暂不声明。
command = ["qwen", "--approval-mode=yolo"]
is_agent = true
pairable = true

[label]
zh = "DC"
en = "DC"

[note]
zh = "训练营自带，默认使用 Qwen Code"
en = "Qwen Code through the camp gateway"

[install]
command = ["npm", "i", "-g", "@qwen-code/qwen-code"]

[install.note]
zh = "需要先装 Node.js"
en = "Requires Node.js"

# DC 默认用 Qwen Code，走网关的 OpenAI 兼容接口。
[env]
OPENAI_BASE_URL = "https://dc-llm.tzspace.cn/v1"
# 模型名由配对写入 pair-models.toml 的 [dc] 段。

[secret]
env = "OPENAI_API_KEY"
url = "https://dc-llm.tzspace.cn/me"

[secret.hint]
zh = "在 dc-llm.tzspace.cn 登录后，从个人空间复制自己的密钥"
en = "Sign in at dc-llm.tzspace.cn and copy the key from your account page"

# 指向 chat/completions 而不是 messages：校验只看状态码，有效的 key 会因为
# 探测请求里那个假模型名换回 400（放行），无效的 key 换回 401（判坏）。
# 见 `verify.rs::verify_with`。
[secret.verify]
url = "https://dc-llm.tzspace.cn/v1/chat/completions"

[api]
base_url = "https://dc-llm.tzspace.cn/v1"
wire = "openai"
