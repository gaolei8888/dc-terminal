# 训练营自己的网关。学生自己注册，钥匙在自己的个人空间里拿。
#
# 主机名指向 dc-llm.tzspace.cn —— 同一个域名下，`/` 是控制台（注册、个人
# 空间），`/v1/*` 是网关本身。所以下面三处地址同源，不是三个服务。
#
# base_url 不带 `/v1`：Claude Code 自己会往后面接 `/v1/messages`。写成
# `.../v1` 会让它去请求 `/v1/v1/messages`，那是一个 404，而错误信息里
# 只会说找不到，不会说是谁多写了一段。
name = "dc"
command = ["claude", "--dangerously-skip-permissions"]
is_agent = true
# 下面三条正则跟 `claude.toml` 一模一样，**不是抄的，是同一份实测**：
# 这个 profile 跑的就是 claude 那个二进制，只换了 `ANTHROPIC_BASE_URL`，
# 而 base_url 不改变它画在屏幕上的任何东西。换掉命令的那天，这三条
# 要跟着重新实测（见 claude.toml 里那段说明它们是怎么测出来的注释）。
busy_pattern = "esc to interrupt"
idle_pattern = "(?m)^❯|bypass permissions on"
error_pattern = "API Error|Connection closed mid-response"
resume_args = ["--continue"]

[label]
zh = "DC"
en = "DC"

[note]
zh = "训练营自带，钥匙在个人空间里拿"
en = "Bundled with the camp; get your key from your own account page"

# 装的是 claude 那个 CLI——这个 profile 只是把它指向别处，没有自己的包。
# 名字仍然写 `dc`：界面发给 shell 的是 `dct install dc`，学生看到的
# 是他自己选的那一项，不是一个他没听过的牌子。
[install]
command = ["npm", "i", "-g", "@anthropic-ai/claude-code"]

[install.note]
zh = "需要先装 Node.js"
en = "Requires Node.js"

[env]
ANTHROPIC_BASE_URL = "https://dc-llm.tzspace.cn"
# 网关如果做不到「进来什么模型名都落到默认模型」，就把下面两行打开、
# 填上真名字。**两行都要**：claude 那个 CLI 干活用一个模型，起标题、
# 扫文件这类杂活另外叫一个便宜的快模型，只钉住前一个的话，杂活会以
# 课堂上没人查得出来的方式坏掉。
# ANTHROPIC_MODEL = "..."
# ANTHROPIC_SMALL_FAST_MODEL = "..."

[secret]
env = "ANTHROPIC_AUTH_TOKEN"
url = "https://dc-llm.tzspace.cn/me"

[secret.hint]
zh = "在 dc-llm.tzspace.cn 登录后，个人空间里复制自己的密钥"
en = "Sign in at dc-llm.tzspace.cn and copy the key from your account page"

[secret.verify]
url = "https://dc-llm.tzspace.cn/v1/messages"

[api]
base_url = "https://dc-llm.tzspace.cn"
wire = "anthropic"

[headless]
command = ["claude", "-p"]
