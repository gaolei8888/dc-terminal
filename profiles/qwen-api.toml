name = "qwen-api"
command = ["claude", "--dangerously-skip-permissions"]
is_agent = true
# 干活时底部一定有「(12s · esc to interrupt)」。
# 不能拿 `? for shortcuts` 当 idle_pattern：上面这条命令带的
# `--dangerously-skip-permissions` 会让底栏常驻「bypass permissions on」，
# 正好把那行顶掉——profile 会用自己的启动参数保证自己永远判不出空闲。
busy_pattern = "esc to interrupt"
error_pattern = "API Error|Connection closed mid-response"

[label]
zh = "Qwen API"
en = "Qwen API"

[note]
zh = "阿里通义，套用 Claude 界面"
en = "Alibaba Qwen, through the Claude interface"

[env]
ANTHROPIC_BASE_URL = "https://dashscope.aliyuncs.com/api/v2/apps/claude-code-proxy"

[secret]
env = "ANTHROPIC_AUTH_TOKEN"
url = "https://bailian.console.aliyun.com/?tab=model#/api-key"

[secret.hint]
zh = "在阿里云百炼控制台创建 API Key"
en = "Create an API key in the Alibaba Cloud Bailian console"

[secret.verify]
url = "https://dashscope.aliyuncs.com/api/v2/apps/claude-code-proxy/v1/messages"
