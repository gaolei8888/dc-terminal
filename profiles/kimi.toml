name = "kimi"
command = ["claude", "--dangerously-skip-permissions"]
is_agent = true
# 干活时底部一定有「(12s · esc to interrupt)」。
# 不能拿 `? for shortcuts` 当 idle_pattern：上面这条命令带的
# `--dangerously-skip-permissions` 会让底栏常驻「bypass permissions on」，
# 正好把那行顶掉——profile 会用自己的启动参数保证自己永远判不出空闲。
busy_pattern = "esc to interrupt"
error_pattern = "API Error|Connection closed mid-response"

[label]
zh = "Kimi"
en = "Kimi"

[note]
zh = "月之暗面，套用 Claude 界面"
en = "Moonshot AI, through the Claude interface"

[env]
ANTHROPIC_BASE_URL = "https://api.moonshot.cn/anthropic"

[secret]
env = "ANTHROPIC_AUTH_TOKEN"
url = "https://platform.moonshot.cn/console/api-keys"

[secret.hint]
zh = "在 platform.moonshot.cn 开通后复制 API Key"
en = "Sign up at platform.moonshot.cn, then copy your API key"

[secret.verify]
url = "https://api.moonshot.cn/anthropic/v1/messages"

[api]
base_url = "https://api.moonshot.cn/anthropic"
wire = "anthropic"
