name = "kimi"
command = ["claude", "--dangerously-skip-permissions"]
is_agent = true
idle_pattern = "\\? for shortcuts"

[label]
zh = "Kimi"
en = "Kimi"

[note]
zh = "月之暗面，套用 Claude 界面"
en = "Moonshot AI, through the Claude interface"

[env]
ANTHROPIC_BASE_URL = "https://api.moonshot.cn/anthropic"

[secret]
env = "ANTHROPIC_AUTH_TOKEN"
url = "https://platform.moonshot.cn/console/api-keys"

[secret.hint]
zh = "在 platform.moonshot.cn 开通后复制 API Key"
en = "Sign up at platform.moonshot.cn, then copy your API key"

[secret.verify]
url = "https://api.moonshot.cn/anthropic/v1/messages"
