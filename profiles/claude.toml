name = "claude"
command = ["claude", "--dangerously-skip-permissions"]
is_agent = true
# 干活时底部一定有「(12s · esc to interrupt)」。
# 不能拿 `? for shortcuts` 当 idle_pattern：上面这条命令带的
# `--dangerously-skip-permissions` 会让底栏常驻「bypass permissions on」，
# 正好把那行顶掉——profile 会用自己的启动参数保证自己永远判不出空闲。
busy_pattern = "esc to interrupt"
error_pattern = "API Error|Connection closed mid-response"

[label]
zh = "Claude"
en = "Claude"

[note]
zh = "Anthropic 官方"
en = "Official Anthropic CLI"

[install]
command = ["npm", "i", "-g", "@anthropic-ai/claude-code"]

[install.note]
zh = "需要先装 Node.js"
en = "Requires Node.js"

[headless]
# 实测：`claude -p/--print` 是官方的非交互模式，提示词作为参数追加。
command = ["claude", "-p"]
