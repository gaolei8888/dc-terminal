<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>dct</title>
<!--
  手机端第 0 期的整个前端。

  规矩三条，改这个文件之前先读：

  1. **一个字的用户可见文案都不许写死在这里。** 全部走 t("key")，键在
     src/web/strings.rs 的 NEEDED 里；那份表由守护进程按当前界面语言填。
     写死的话，`l` 键切语言手机上不跟着变，而且 i18n.rs 那两条守卫查不到它。
     有一条测试会扫这个文件：出现汉字，或者出现任何一句英文文案的字面量，
     就挂。
  2. **没有外部资源。** 没有 CDN、没有字体、没有图。局域网里那台手机可能
     根本没有外网，而一个转着圈加载不出来的页面比朴素的页面糟得多。
  3. **不改 PTY 尺寸。** 手机永远不发 resize（spec 决定四）：画布尺寸归桌面
     那一侧，手机只是在看同一块画布。
-->
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #14161b;
    --dim: #5b6472;
    --line: #d9dde3;
    --accent: #005f87;
    --ok: #2f6f3e;
    --busy: #8a5a00;
    --bad: #a8322a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1116;
      --card: #171a20;
      --ink: #e7eaef;
      --dim: #8b95a5;
      --line: #262b34;
      --accent: #63b3d9;
      --ok: #7fc08c;
      --busy: #e8c07d;
      --bad: #e88c7d;
    }
  }
  * { box-sizing: border-box; }
  /* `hidden` 属性的 display:none 来自浏览器默认样式，而作者样式里**任何**
     一个 display 都比它优先——`main { display: grid }` 就把它顶掉了，于是
     `listEl.hidden = true` 之后列表照样铺在画面下面。这一条把它按回去。
     （这个 bug 是把页面真的打开看了一眼才发现的，DOM 里 hidden 明明是 true。） */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0;
    display: flex; align-items: center; gap: .5rem;
    padding: .8rem 1rem;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .01em; }
  #dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); }
  #dot.off { background: var(--bad); }
  main { padding: .75rem; display: grid; gap: .6rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: .6rem;
    padding: .75rem .85rem;
    display: grid;
    gap: .3rem;
    /* 整张卡是可点的，指头够得着：44px 是能稳定点中的下限 */
    min-height: 44px;
    cursor: pointer;
  }
  .top { display: flex; align-items: baseline; gap: .5rem; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { margin-left: auto; font-size: .8rem; white-space: nowrap; }
  .state.idle { color: var(--ok); }
  .state.working, .state.asking { color: var(--busy); }
  .state.failed { color: var(--bad); }
  .state.stopped, .state.unknown { color: var(--dim); }
  .project { font-size: .8rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .activity {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .78rem; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .notice { padding: 2rem 1rem; text-align: center; color: var(--dim); }
  .notice.bad { color: var(--bad); }

  /* 会话画面。整块是一张固定宽度的画布——手机不改 PTY 尺寸（spec 决定四），
     所以这里靠字号把它缩到屏幕宽度，缩到看不清就让人自己捏放大。 */
  #screen { position: relative; padding: .5rem; overflow: auto; }
  #screen pre {
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", monospace;
    line-height: 1.2;
    white-space: pre;
    /* 画面里的字不参与系统的自动放大：iOS 会把它当正文放大，一行就散了 */
    -webkit-text-size-adjust: none;
    text-size-adjust: none;
  }
  #cursor {
    position: absolute;
    background: var(--ink);
    opacity: .65;
    pointer-events: none;
  }
  #back {
    background: none; border: 0; padding: .1rem .4rem;
    font: inherit; font-size: 1.3rem; line-height: 1;
    color: var(--accent); cursor: pointer;
  }
  #ruler { position: absolute; visibility: hidden; white-space: pre; }
</style>
</head>
<body>
<header>
  <button id="back" type="button" hidden>&lsaquo;</button>
  <span id="dot"></span>
  <h1 id="title"></h1>
</header>
<main id="list"></main>
<div id="screen" hidden><span id="ruler">MMMMMMMMMM</span><pre id="canvas"></pre><div id="cursor" hidden></div></div>

<script>
(function () {
  "use strict";

  // 二维码里的令牌放在 fragment（#t=…），不放查询串：查询串会进浏览器历史、
  // 进任何中间日志，而 fragment 根本不上行。拿到之后立刻换成同源 cookie，
  // 并把地址栏里那一截抹掉——之后每次请求靠 cookie 带，地址可以随便分享。
  //
  // 有效期给 30 天而不是"关掉浏览器就失效"：后者意味着每次重开浏览器都要
  // 重新扫一次码，而扫码要人走到电脑跟前——这个功能本来就是给不在电脑跟前
  // 的人用的。撤销靠换令牌（设置页），不靠 cookie 短命。
  (function claimToken() {
    var m = /(?:^|[#&])t=([^&]+)/.exec(location.hash || "");
    if (!m) { return; }
    document.cookie =
      "dct_web=" + m[1] + "; path=/; max-age=2592000; SameSite=Strict";
    history.replaceState(null, "", location.pathname);
  })();

  // 文案表。**空表也要能跑**——网络没起来时页面照样显示结构，
  // 只是文字空着，比整页白屏强。
  var S = {};
  function t(key) { return S[key] || ""; }

  var listEl = document.getElementById("list");
  var dotEl = document.getElementById("dot");
  var titleEl = document.getElementById("title");
  var screenEl = document.getElementById("screen");
  var canvasEl = document.getElementById("canvas");
  var rulerEl = document.getElementById("ruler");
  var cursorEl = document.getElementById("cursor");
  var backEl = document.getElementById("back");

  // 当前在看什么：会话列表，还是某个会话的画面。
  var open = null;   // null = 列表；否则是会话 id

  function api(path) {
    return fetch(path, { credentials: "same-origin" }).then(function (r) {
      if (!r.ok) { throw new Error("http " + r.status); }
      return r.json();
    });
  }

  // 协议里的会话状态是一个字符串枚举（SessionState），这里只把它映射到
  // 文案表的键上。**认不出来的一律当 unknown**：编一个状态出来比承认
  // 不知道更糟（同看板上那条「没有 pattern 就显示 —」）。
  function stateKey(state) {
    switch (state) {
      case "Working": return "working";
      case "Asking": return "asking";
      case "Idle": return "idle";
      case "Stopped": return "stopped";
      case "Failed": return "failed";
      default: return "unknown";
    }
  }

  // 项目目录里最后一段。整条路径在手机上一行放不下，而认项目靠的是最后一段。
  function projectOf(dir) {
    var parts = String(dir || "").split(/[\\/]+/).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : "";
  }

  function notice(text, bad) {
    var d = document.createElement("div");
    d.className = bad ? "notice bad" : "notice";
    d.textContent = text;
    return d;
  }

  function card(s) {
    var el = document.createElement("div");
    el.className = "card";
    el.dataset.id = s.id;
    el.addEventListener("click", function () { openSession(s.id, s); });

    var top = document.createElement("div");
    top.className = "top";

    var name = document.createElement("span");
    name.className = "name";
    // 会话没起过名字就退回 profile 名——跟桌面同一条规矩：诚实报一个编号
    // 或者 profile，绝不编一个不存在的名字。
    name.textContent = s.id + " " + (s.tag && s.tag.trim() ? s.tag : s.profile);

    var key = stateKey(s.state);
    var state = document.createElement("span");
    state.className = "state " + key;
    state.textContent = t(key);

    top.appendChild(name);
    top.appendChild(state);

    var project = document.createElement("div");
    project.className = "project";
    project.textContent = projectOf(s.dir);

    el.appendChild(top);
    el.appendChild(project);

    if (s.activity && s.activity.trim()) {
      var act = document.createElement("div");
      act.className = "activity";
      act.textContent = s.activity;
      el.appendChild(act);
    }
    return el;
  }

  function render(sessions) {
    listEl.textContent = "";
    if (!sessions.length) {
      listEl.appendChild(notice(t("empty")));
      return;
    }
    sessions.forEach(function (s) { listEl.appendChild(card(s)); });
  }

  // ——会话画面————————————————————————————————————————————————

  // 256 色索引 → CSS。0–15 是终端自己的十六色（各家主题不一样，这里用一套
  // 常见的取值），16–231 是 6×6×6 色立方，232–255 是灰阶。跟
  // `ui::mod.rs` 里那条对比度守卫算的是同一套公式。
  var BASE16 = [
    "#000000", "#cd0000", "#00cd00", "#cdcd00",
    "#0000ee", "#cd00cd", "#00cdcd", "#e5e5e5",
    "#7f7f7f", "#ff0000", "#00ff00", "#ffff00",
    "#5c5cff", "#ff00ff", "#00ffff", "#ffffff"
  ];
  function idxColor(i) {
    if (i < 16) { return BASE16[i]; }
    if (i >= 232) {
      var v = 8 + 10 * (i - 232);
      return "rgb(" + v + "," + v + "," + v + ")";
    }
    var STEP = [0, 95, 135, 175, 215, 255];
    var n = i - 16;
    return "rgb(" + STEP[Math.floor(n / 36)] + "," +
      STEP[Math.floor((n % 36) / 6)] + "," + STEP[n % 6] + ")";
  }

  // 协议里的颜色是三选一：字符串 "Default"、{Idx:n}、{Rgb:[r,g,b]}。
  //
  // **判 Idx 必须用 typeof，不能用真值判断**：0 号色是黑色，而 `if (c.Idx)`
  // 对 0 是假的——一整屏的黑字会被当成"没上色"。
  function cssColor(c) {
    if (!c || c === "Default") { return null; }
    if (typeof c.Idx === "number") { return idxColor(c.Idx); }
    if (c.Rgb) { return "rgb(" + c.Rgb.join(",") + ")"; }
    return null;
  }

  function styleOf(st) {
    if (!st) { return ""; }
    var fg = cssColor(st.fg);
    var bg = cssColor(st.bg);
    // 反显 = 前景背景对调。哪一边本来没有具体颜色，就拿页面自己的那一档补上——
    // 不补的话，一屏默认色上的"反显"什么都看不出来（而反显正是 dct 自己用来
    // 标"当前项目"的手法）。
    if (st.inverse) {
      var swapped = [bg || "var(--bg)", fg || "var(--ink)"];
      fg = swapped[0];
      bg = swapped[1];
    }
    var out = "";
    if (fg) { out += "color:" + fg + ";"; }
    if (bg) { out += "background:" + bg + ";"; }
    if (st.bold) { out += "font-weight:600;"; }
    if (st.italic) { out += "font-style:italic;"; }
    if (st.underline) { out += "text-decoration:underline;"; }
    return out;
  }

  // 一整屏画成 <pre> 里的一串 <span>。**用 textContent 塞字**，
  // 不拼 HTML 字符串——屏幕上的内容来自 agent，里面什么字节都可能有。
  function paint(lines) {
    canvasEl.textContent = "";
    var cols = 0;
    lines.forEach(function (spans, row) {
      var width = 0;
      spans.forEach(function (sp) {
        var el = document.createElement("span");
        var css = styleOf(sp.style);
        if (css) { el.setAttribute("style", css); }
        el.textContent = sp.text;
        width += sp.text.length;
        canvasEl.appendChild(el);
      });
      if (width > cols) { cols = width; }
      if (row < lines.length - 1) {
        canvasEl.appendChild(document.createTextNode("\n"));
      }
    });
    return cols;
  }

  // 画布多宽就把字号调到多小，让一行**整行**放得进屏幕。
  //
  // 手机不改 PTY 尺寸（spec 决定四：桌面是唯一有 resize 权的客户端），所以
  // 一行就是一行，横着滚动去读一行终端输出等于没法读。缩到 6px 以下就不再缩了，
  // 那时候已经不是"小"而是"看不见"——剩下的交给捏放大。
  function fitFont(cols) {
    if (!cols) { return; }
    var probe = 16;
    canvasEl.style.fontSize = probe + "px";
    rulerEl.style.fontSize = probe + "px";
    var per = rulerEl.getBoundingClientRect().width / 10;
    if (!per) { return; }
    var avail = screenEl.clientWidth - 16;
    var size = Math.floor((avail / (cols * per)) * probe);
    canvasEl.style.fontSize = Math.max(6, Math.min(16, size)) + "px";
  }

  function placeCursor(pos, hidden) {
    if (hidden || !pos) { cursorEl.hidden = true; return; }
    var size = parseFloat(canvasEl.style.fontSize) || 16;
    rulerEl.style.fontSize = size + "px";
    var per = rulerEl.getBoundingClientRect().width / 10;
    var lineH = size * 1.2;
    cursorEl.hidden = false;
    cursorEl.style.width = per + "px";
    cursorEl.style.height = lineH + "px";
    cursorEl.style.left = (8 + pos[1] * per) + "px";
    cursorEl.style.top = (8 + pos[0] * lineH) + "px";
  }

  function drawScreen(resp) {
    if (!resp || !resp.Screen) { throw new Error("unexpected response"); }
    var s = resp.Screen;
    var cols = paint(s.lines || []);
    fitFont(cols);
    // `cursor_hidden` 为真时一定不画。agent 干活时把光标关掉，而那个坐标
    // 还在满屏乱跑——照着画就是一个到处蹦的方块（桌面端踩过这个坑）。
    placeCursor(s.cursor, s.cursor_hidden);
    dotEl.className = "";
  }

  function openSession(id, info) {
    open = id;
    listEl.hidden = true;
    screenEl.hidden = false;
    backEl.hidden = false;
    if (info) {
      titleEl.textContent = id + " " + (info.tag && info.tag.trim() ? info.tag : info.profile);
    }
    tick();
  }

  function closeSession() {
    open = null;
    screenEl.hidden = true;
    cursorEl.hidden = true;
    listEl.hidden = false;
    backEl.hidden = true;
    titleEl.textContent = t("title");
    tick();
  }

  backEl.addEventListener("click", closeSession);

  function offline() {
    dotEl.className = "off";
    listEl.textContent = "";
    listEl.appendChild(notice(t("offline"), true));
  }

  function refreshList() {
    return api("/api/sessions").then(function (resp) {
      // 协议的答复是一个 externally tagged 的枚举：{"Sessions": [...]}。
      // 别的形状（比如 {"Error": …}）当成「这一轮没拿到」，不硬解。
      if (!resp || !resp.Sessions) { throw new Error("unexpected response"); }
      dotEl.className = "";
      render(resp.Sessions);
    }).catch(offline);
  }

  function refreshScreen(id) {
    return api("/api/screen?id=" + encodeURIComponent(id))
      .then(drawScreen)
      .catch(offline);
  }

  // 一个定时器管两种画面，节奏不一样：
  //
  // - 画面 300ms 一帧。桌面端是 16ms，那是本地 socket 的节奏；这一条链路上
  //   16ms 是白烧电池和带宽，而 300ms 已经跟得上人读屏幕的速度（spec 的「流控」）。
  // - 列表 3 秒一次。它只是几行状态，更快没有意义。
  //
  // **只在前台跑。** 手机锁屏之后一帧都不该发——人在兜里揣着，dct 在家里
  // 每秒被问三次。`document.visibilityState` 是这件事唯一可靠的信号。
  var SCREEN_MS = 300;
  var LIST_EVERY = 10;   // 10 × 300ms = 3s
  var timer = null;
  var ticks = 0;

  // 「现在该不该发请求」**只有这一处说了算**。
  //
  // 抄成三处（定时器里一处、进画面时一处、切回前台时一处）的话，将来漏改
  // 其中一处的症状是"手机锁着屏，dct 在家里每秒被问三次"——而这件事在手机上
  // 完全看不出来，只会体现在电池和流量上。有一条守卫钉着这个唯一性。
  function shouldPoll() {
    return document.visibilityState === "visible";
  }

  function tick() {
    if (!shouldPoll()) { return; }
    if (open !== null) { refreshScreen(open); return; }
    refreshList();
  }

  function start() {
    if (timer) { return; }
    tick();
    timer = setInterval(function () {
      if (!shouldPoll()) { return; }
      ticks++;
      if (open !== null) { refreshScreen(open); }
      else if (ticks % LIST_EVERY === 0) { refreshList(); }
    }, SCREEN_MS);
  }

  document.addEventListener("visibilitychange", tick);

  // 先取文案再取列表：文案空着的时候「还没有会话」会显示成一片空白，
  // 用户会以为页面坏了。取不到就用空表继续——结构照样在。
  api("/api/strings?lang=" + encodeURIComponent(navigator.language || ""))
    .then(function (map) { S = map || {}; })
    .catch(function () { S = {}; })
    .then(function () {
      titleEl.textContent = t("title");
      document.title = t("title") || "dct";
      start();
    });
})();
</script>
</body>
</html>
