# 单人版：一条 `docker compose up` 起一份能用的 dc-workspace。
#
# **这一份必须自足。** 计划里立了一条能证伪的规矩：本仓库的任何测试、任何
# CI、任何 README 步骤，都不许出现部署方仓库的名字。「三十个学生怎么发、
# 反代、证书、配额」是部署方的事；这里只负责「起一份，能用」——发三十份就是
# 跑三十次。
name: dc-workspace

services:
  dc:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: dc-workspace:dev

    # PID 1 的收尸问题在 Dockerfile 里用 tini 解决了，这里不再叠一层
    # `init: true`——两个 init 串起来只是多一层，不多一分保证。

    # 一个 agent 常驻约 320 MB（实测，见 README 那节），加上容器底子。
    # 这个数字是**单人**的：一个人同时开三个 agent 还有余量。
    mem_limit: 2g

    volumes:
      # 状态，缺一个学生就丢东西（见 Dockerfile 里 VOLUME 那段）。
      - dct-state:/home/dc/.dct
      - claude-state:/home/dc/.claude
      # 代码。**这里是命名卷**——IO 原速、git 检查点原速，代价是宿主上看不到
      # 文件。换成绑定挂载（`- ./work:/home/dc/work`）能用本地编辑器，但
      # Windows/macOS 上会拖垮编译，换行和权限还会咬 git 检查点。
      # 两种都要在任务 5 里各跑一遍检查点和撤销，代价写进 container/README.md。
      - work:/home/dc/work

    ports:
      # **仍然绑在宿主的环回上。** 门（`dct gate`）已经在了：没带对钥匙的
      # 请求一律 401，路径存不存在都问不出来。但**这一层还没有加密**——
      # 明文 HTTP 上，cookie 里那把钥匙每个请求都在线上裸奔。
      #
      # 所以要给别人用，改成 `"7681:7681"` 之前先在前面架一层 TLS 反代，
      # 并把 DCW_PUBLIC_URL 指到反代那个地址上。这跟 `dct-srv` 的
      # `must_be_loopback` 是同一条线：没有加密之前，不许当成对外可用。
      - "127.0.0.1:7681:7681"

    environment:
      # 门用它拼那条发得出去的链接。默认就是上面那条端口映射看到的地址；
      # 架了反代就改成反代的地址，容器自己不可能知道。
      DCW_PUBLIC_URL: "http://127.0.0.1:7681"

    # 起来之后钥匙在日志里（**那是一条凭据**，别把日志贴到公开的地方）：
    #   docker compose -f container/compose.yaml logs dc | grep '#t='
    # 只想重新拿一次链接、不重启：
    #   docker compose -f container/compose.yaml exec dc dct gate --link --url http://127.0.0.1:7681

volumes:
  dct-state:
  claude-state:
  work:
