<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>课堂管理</title>
<style>
:root{color-scheme:light;font:15px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif;color:#20352f;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,summary,a{touch-action:manipulation}button{cursor:pointer;border:1px solid #d2dcd5;border-radius:8px;padding:8px 13px;background:#fff;color:#254b3a}button:hover{background:#edf3ed}button:disabled{opacity:.5;cursor:wait}button.primary{background:#2e654b;color:#fff;border-color:#2e654b}button.danger{color:#9b352c}input,textarea,select{border:1px solid #c7d3c9;border-radius:7px;padding:9px;background:#fff;max-width:100%;color:inherit}:focus-visible{outline:3px solid #91b7a0;outline-offset:3px}[hidden]{display:none!important}h1{font-size:23px;margin:0}h2{font-size:19px;margin:0}p{margin:8px 0}header,.bar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:23px}.muted{color:#64776c;font-size:13px}main{max-width:1080px;margin:auto;padding:28px 22px}#login{max-width:380px;margin:12vh auto;background:white;border:1px solid #e0e7df;border-radius:14px;padding:28px}#login label,#login input{display:block;width:100%;margin-top:14px}#login button{margin-top:18px;width:100%}#message{margin:12px 0;color:#305f46;white-space:pre-wrap;overflow-wrap:anywhere}#message.error{color:#a1372c}#capacity{padding:17px 20px;border:1px solid #dbe4da;background:#eaf0e7;border-radius:12px;margin-bottom:24px}#list-head{justify-content:space-between;margin-bottom:12px}.student{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;background:white;border:1px solid #e0e6df;border-radius:10px;margin-bottom:10px}.identity{min-width:0;flex:1}.name{font-weight:650;font-size:16px;overflow-wrap:anywhere}.badge{font-size:12px;font-weight:400;background:#eef2eb;padding:2px 7px;border-radius:5px;margin-left:7px;display:inline-block}.metrics{font-size:12px;color:#66766b;margin-top:5px}details{position:relative}summary{cursor:pointer;list-style:none;padding:8px;border-radius:8px;color:#65776b}summary::-webkit-details-marker{display:none}.menu{position:absolute;right:0;top:100%;z-index:5;background:#fff;padding:6px;border:1px solid #d5dfd5;box-shadow:0 8px 22px #24342918;border-radius:9px;min-width:150px}.menu button{display:block;border:0;width:100%;text-align:left;white-space:nowrap}dialog{border:1px solid #d4ded4;border-radius:13px;padding:24px;width:min(430px,calc(100% - 32px));color:inherit}dialog::backdrop{background:#15271f50}dialog label{display:block;margin:16px 0 8px}dialog textarea{width:100%;resize:vertical}dialog .actions{justify-content:flex-end;margin-top:16px}#viewer .bar{margin-bottom:12px}#viewer-name{overflow-wrap:anywhere}#student-select{max-width:340px}#screen{background:#17221d;color:#e4ece5;min-height:52vh;border-radius:10px;margin:12px 0;padding:18px;font:14px/1.45 ui-monospace,SFMono-Regular,monospace;white-space:pre;overflow:auto}#frame iframe{display:block;border:1px solid #c6d3c7;border-radius:10px;background:#fff;width:100%;height:72vh}#mode{font-size:13px;padding:6px 10px;border-radius:6px;background:#e6eee4}#mode.assisting{background:#fff0ce;color:#795a12}#empty{text-align:center;padding:50px 16px;color:#64776c}@media(max-width:650px){main{padding:20px 14px}.student{align-items:flex-start;flex-direction:column;padding:15px}.student .actions{width:100%}.student details{margin-left:auto}.metrics{line-height:1.8}#viewer .bar{align-items:flex-start}#student-select{width:100%;max-width:100%}#screen{padding:12px;font-size:12px}header{margin-bottom:16px}}

/* Viewing a student is a workspace, sized to the visible browser viewport. */
body:has(#viewer:not([hidden])){overflow:hidden}
body:has(#viewer:not([hidden])) main{max-width:none;width:100%;height:100vh;height:100dvh;padding:8px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
body:has(#viewer:not([hidden])) header{display:none}
body:has(#viewer:not([hidden])) #message{margin:0;flex:none}
body:has(#viewer:not([hidden])) #message:empty{display:none}
#viewer:not([hidden]){display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}
#viewer>.bar{flex:none;margin:0;gap:8px}
#viewer-name{display:none}
#viewer #student-select{width:auto;max-width:min(280px,100%);min-width:0}
#readonly{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}
#readonly .bar{margin:0;flex:none}
#screen{flex:1;min-height:0;margin:0}
#frame{display:flex;flex:1;min-height:0}
#frame:empty{display:none}
#frame iframe{flex:1;min-height:0;height:100%;border-radius:6px}
@media(max-width:650px){#viewer #student-select{flex:1;max-width:calc(100% - 145px)}#viewer>.bar{align-items:center}#mode{font-size:12px}}
</style>
</head>
<body><main>
<header><h1>课堂管理</h1><button id="logout" hidden>退出登录</button></header>
<div id="message" role="status" aria-live="polite"></div>
<form id="login" hidden><h2>管理员登录</h2><label for="password">管理密码</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">登录</button></form>
<section id="dashboard" hidden><div id="capacity"></div><div id="list-head" class="bar"><h2>学生工作区</h2><label>班级 <select id="class-filter" aria-label="班级"><option value="">全部班级</option></select></label><button id="add" class="primary">添加学生</button></div><div id="students"></div><p id="empty" hidden>还没有学生，添加姓名即可开始。</p></section>
<section id="viewer" hidden><div class="bar"><button id="back">返回学生列表</button><select id="student-select" aria-label="切换学生"></select><h2 id="viewer-name"></h2><span id="mode">只读查看</span><button id="assist" class="primary">协助</button><button id="end-assist" hidden>结束协助</button></div><div id="readonly"><div class="bar"><label for="session">终端会话</label><select id="session"></select><span class="muted">每秒更新 · 查看不会输入或修改内容</span></div><pre id="screen" tabindex="0" aria-label="学生终端，只读"></pre></div><div id="frame"></div></section>
<dialog id="add-dialog"><form id="add-form"><h2>添加学生</h2><p class="muted">新工作区首次由老师配置 AI 账号，配置好后再发送链接。</p><label for="names">学生姓名，每行一个</label><textarea id="names" rows="6" required placeholder="小王&#10;小李"></textarea><div class="actions"><button type="button" id="cancel-add">取消</button><button type="submit" class="primary">确认添加</button></div></form></dialog>
<dialog id="link-dialog"><h2>学生链接</h2><p class="muted">请复制下方链接发给学生。</p><input id="share-link" aria-label="学生链接" readonly style="width:100%"><div class="actions"><button id="close-link">完成</button></div></dialog>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
let manageAccess=true,students=[],selected=null,assisting=false,observeTimer=null,renewTimer=null,viewVersion=0,observeBusy=false,renewBusy=false,actionBusy=false;
const labelStatus={running:'运行中',stopped:'已停止',new:'未启动',disabled:'已停用'};
function message(text='',error=false){$('message').textContent=text;$('message').className=error?'error':'';}
function cancelTimers(){clearTimeout(observeTimer);clearInterval(renewTimer);observeTimer=renewTimer=null;}
function loginScreen(){viewVersion++;cancelTimers();selected=null;assisting=false;$('frame').replaceChildren();$('viewer').hidden=true;$('dashboard').hidden=true;$('login').hidden=false;$('logout').hidden=true;for(const dialog of document.querySelectorAll('dialog'))dialog.close();$('share-link').value='';}
async function api(path,data){const res=await fetch('/admin/api'+path,{method:data===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:data===undefined?{}:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const result=await res.json().catch(()=>({}));if(!res.ok){if(res.status===401)loginScreen();throw Error(result.error||'操作失败，请稍后重试。');}return result;}
async function action(button,fn){if(actionBusy)return;actionBusy=true;button.disabled=true;message();try{await fn();}catch(error){message(error.message,true);}finally{button.disabled=false;actionBusy=false;}}
function size(value){if(value==null)return'未知';if(value===0)return'0 B';const units=['B','KB','MB','GB','TB'];const power=Math.min(4,Math.floor(Math.log(value)/Math.log(1024)));return(value/1024**power).toFixed(power?1:0)+' '+units[power];}
function button(text,fn,kind){const el=document.createElement('button');el.textContent=text;if(kind)el.className=kind;el.onclick=()=>action(el,fn);return el;}
function route(id,op){return'/students/'+encodeURIComponent(id)+'/'+op;}
async function copyText(url){try{await navigator.clipboard.writeText(url);}catch{$('share-link').value=url;$('link-dialog').showModal();$('share-link').select();}}
async function copyLink(id,rotate=false){const result=await api(route(id,rotate?'rotate':'link'),{});try{await navigator.clipboard.writeText(result.url);message(rotate?'链接已重置并复制，旧链接已失效。':'学生链接已复制。');}catch{$('share-link').value=result.url;$('link-dialog').showModal();$('share-link').select();message(rotate?'链接已重置，旧链接已失效。':'请复制学生链接。');}}
function render(){const root=$('students');root.replaceChildren();$('empty').hidden=students.length>0;for(const student of students.filter(s=>!$('class-filter').value||(s.classId||'-')===$('class-filter').value)){const row=document.createElement('article');row.className='student';const identity=document.createElement('div');identity.className='identity';const name=document.createElement('div');name.className='name';name.textContent=student.name;const badge=document.createElement('span');badge.className='badge';badge.textContent=(labelStatus[student.status]||student.status)+(student.shared?' · 共享工作区':'');name.append(badge);const metrics=document.createElement('div');metrics.className='metrics';metrics.textContent=(student.className?student.className+' · ':'')+'内存 '+size(student.memoryBytes)+' · 磁盘 '+size(student.diskBytes)+' · 连接 '+(student.connections??'未知')+(student.assisting?' · 正在协助':'')+(student.live?' · ● 直播中 · '+(student.live.viewers??0)+' 人在看':'');identity.append(name,metrics);const controls=document.createElement('div');controls.className='actions';const link=button('复制链接',()=>copyLink(student.id));link.disabled=student.status==='disabled';if(manageAccess)controls.append(link);controls.append(button('查看',()=>openViewer(student.id)));const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='更多';summary.setAttribute('aria-label',student.name+'的更多操作');const menu=document.createElement('div');menu.className='menu';const menuAction=(text,fn,danger)=>menu.append(button(text,async()=>{details.open=false;await fn();},danger?'danger':null));if(student.live)menuAction('复制直播链接',async()=>{await copyText(student.live.url);message('直播链接已复制，发给学生就能看。他们只能看，不能操作。');});if(student.status==='running'&&!student.live)menuAction('直播这个工作区',async()=>{if(confirm('直播「'+student.name+'」的画面？学生拿到链接后只能看、不能操作；链接发出去就收不回来，停播才失效。')){const r=await api(route(student.id,'live-start'),{});await loadState();if(r.live&&r.live.url){await copyText(r.live.url);message('已开播，链接已复制。'+(r.live.readiness&&r.live.readiness!=='Ready'?'（中转还在确认，稍等一下再发）':''));}else message('已开播。');}});if(student.live)menuAction('停止直播',async()=>{await api(route(student.id,'live-stop'),{});await loadState();message('已停播，学生那边会显示「这场直播结束了」。');},true);if(student.shared)menu.append(Object.assign(document.createElement('div'),{className:'muted',style:'padding:8px;white-space:nowrap',textContent:'共享工作区不能在这里停止'}));if(!student.shared&&student.status==='running')menuAction('停止工作区',async()=>{if(confirm('停止「'+student.name+'」？系统会先归档项目，再停止工作区；归档失败时会保留运行状态。')){await api(route(student.id,'stop'),{});await loadState();message('工作区已归档并停止。');}},true);else if(!student.shared&&student.status!=='disabled')menuAction('启动工作区',async()=>{await api(route(student.id,'start'),{});await loadState();message('工作区已启动。');});if(manageAccess){if(student.status==='disabled')menuAction('恢复访问',async()=>{await api(route(student.id,'enable'),{});await loadState();message('已恢复访问。');});else{menuAction('重置链接',async()=>{if(confirm('重置「'+student.name+'」的链接？旧链接和已有学生连接将失效。'))await copyLink(student.id,true);},true);menuAction('停用访问',async()=>{if(confirm('停用「'+student.name+'」的访问？学生将无法继续连接，项目文件会保留。')){await api(route(student.id,'disable'),{});await loadState();message('已停用学生访问。');}},true);}}details.append(summary,menu);controls.append(details);row.append(identity,controls);root.append(row);}}
async function loadState(){const data=await api('/state');students=data.students||[];manageAccess=data.permissions?.manageAccess!==false;$('add').hidden=!manageAccess;const filter=$('class-filter'),previous=filter.value,classes=new Map(students.map(s=>[s.classId||'-',s.className||'未分班']));filter.replaceChildren(new Option('全部班级',''),...Array.from(classes,([id,name])=>new Option(name,id)));if(classes.has(previous))filter.value=previous;const c=data.capacity||{};$('capacity').textContent='运行中 '+(c.running??'未知')+' / '+(c.max??'未知')+' 个工作区 · 主机内存 '+size(c.totalMemory);$('login').hidden=true;$('logout').hidden=false;if(!selected)$('dashboard').hidden=false;render();}
function readonly(){assisting=false;clearInterval(renewTimer);renewTimer=null;$('frame').replaceChildren();$('readonly').hidden=false;$('assist').hidden=false;$('end-assist').hidden=true;$('mode').textContent='只读查看';$('mode').className='';}
async function endAssist(){if(assisting&&selected){const id=selected;await api(route(id,'end-assist'),{});}readonly();}
async function openViewer(id){if(assisting)await endAssist();viewVersion++;cancelTimers();selected=id;readonly();$('dashboard').hidden=true;$('viewer').hidden=false;$('viewer-name').textContent=students.find(s=>s.id===id)?.name||id;$('student-select').replaceChildren(...students.map(s=>new Option(s.name,s.id)));$('student-select').value=id;$('session').replaceChildren();$('screen').textContent='正在读取终端…';$('assist').disabled=students.find(s=>s.id===id)?.status!=='running';await observe();}
async function observe(){clearTimeout(observeTimer);if(!selected||assisting)return;if(observeBusy){observeTimer=setTimeout(observe,1000);return;}observeBusy=true;const version=viewVersion,id=selected,session=$('session').value;try{const data=await api(route(id,'observe')+(session?'?session='+encodeURIComponent(session):''));if(version!==viewVersion||assisting)return;const options=data.sessions||[];const old=$('session').value;const current=options.map(s=>String(s.id));if(JSON.stringify(Array.from($('session').options,o=>[o.value,o.text]))!==JSON.stringify(options.map(s=>[String(s.id),s.profile||'终端 '+s.id]))){$('session').replaceChildren(...options.map(s=>new Option(s.profile||'终端 '+s.id,s.id)));if(current.includes(old))$('session').value=old;}$('session').disabled=!options.length;$('screen').textContent=data.screen?.lines?.map(line=>line.map(span=>span.text||'').join('')).join('\n')||'暂无终端画面。学生开始工作后会显示在这里。';}catch(error){if(version===viewVersion)message(error.message,true);}finally{observeBusy=false;if(selected&&!assisting)observeTimer=setTimeout(observe,1000);}}
async function startAssist(){const id=selected;const result=await api(route(id,'assist'),{});const url=new URL(result.url,location.origin);if(url.origin!==location.origin||!url.pathname.startsWith('/admin/workspaces/'+encodeURIComponent(id)+'/')){await api(route(id,'end-assist'),{});throw Error('协助地址无效，请重试。');}assisting=true;viewVersion++;clearTimeout(observeTimer);$('readonly').hidden=true;$('assist').hidden=true;$('end-assist').hidden=false;$('mode').textContent='正在协助 · 输入会影响学生工作区';$('mode').className='assisting';const iframe=document.createElement('iframe');iframe.title='协助 '+(students.find(s=>s.id===id)?.name||'学生');iframe.src=url.pathname+url.search;$('frame').replaceChildren(iframe);renewTimer=setInterval(async()=>{if(renewBusy||!assisting||selected!==id)return;renewBusy=true;try{await api(route(id,'assist'),{});}catch(error){readonly();message('协助已中断：'+error.message,true);if(selected)observe();}finally{renewBusy=false;}},15000);}
$('login').onsubmit=event=>{event.preventDefault();action($('login').querySelector('button'),async()=>{await api('/login',{password:$('password').value});$('password').value='';await loadState();});};
$('logout').onclick=()=>action($('logout'),async()=>{if(assisting)await endAssist();await api('/logout',{});loginScreen();message();});
$('class-filter').onchange=render;
$('add').onclick=()=>{$('add-dialog').showModal();$('names').focus();};$('cancel-add').onclick=()=>$('add-dialog').close();$('add-form').onsubmit=event=>{event.preventDefault();action($('add-form').querySelector('[type=submit]'),async()=>{const names=$('names').value.split(/\r?\n/).map(n=>n.trim()).filter(Boolean);if(!names.length)throw Error('请输入至少一个学生姓名。');await api('/students',{names});$('names').value='';$('add-dialog').close();await loadState();message('学生已添加，可在“更多”中启动工作区。');});};
$('back').onclick=()=>action($('back'),async()=>{await endAssist();viewVersion++;cancelTimers();selected=null;$('viewer').hidden=true;await loadState();});$('student-select').onchange=()=>{const id=$('student-select').value;action($('student-select'),async()=>{try{await openViewer(id);}catch(error){$('student-select').value=selected;throw error;}});};$('session').onchange=()=>{viewVersion++;observe();};$('assist').onclick=()=>action($('assist'),startAssist);$('end-assist').onclick=()=>action($('end-assist'),async()=>{await endAssist();message('协助已结束，已回到只读查看。');observe();});$('close-link').onclick=()=>{$('link-dialog').close();$('share-link').value='';};
window.addEventListener('pagehide',()=>{cancelTimers();if(assisting&&selected)fetch('/admin/api'+route(selected,'end-assist'),{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',credentials:'same-origin',keepalive:true}).catch(()=>{});});
loadState().catch(error=>message(error.message,true));
</script></body></html>
