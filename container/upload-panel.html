<script>
(function () {
  'use strict';
  var panel=document.getElementById('dcw-panel'),button=document.getElementById('dcw-theme');
  var prefix=typeof window.DCW_BASE_PATH==='string'?window.DCW_BASE_PATH:'';
  var student=prefix.match(/^\/w\/([^/]+)/)||prefix.match(/^\/admin\/workspaces\/([^/]+)/);
  var key='dcw-appearance:'+(student?student[1]:'shared'),chosen=null,nativeTheme='dark';
  function valid(value){return value==='light'||value==='dark'?value:null;}
  try{chosen=valid(localStorage.getItem(key));}catch(e){}
  function apply(){
    var theme=chosen||nativeTheme,light=theme==='light',terminal=document.getElementById('terminal-container');
    panel.dataset.theme=theme;
    document.getElementById("dcw-footbar").dataset.theme=theme;
    document.documentElement.style.colorScheme=theme;
    document.body.style.backgroundColor=light?'#f5f6f8':'#191c23';
    // xterm may use a WebGL canvas and agents may emit explicit RGB cells.
    // Transform the rendered terminal as one surface, including its cursor and
    // selection. This preserves running sessions and never injects terminal input.
    // When the agent already matches the requested appearance, leave it untouched.
    if(terminal)terminal.dataset.dcwInvert=String(theme!==nativeTheme);
    button.textContent=light?'☾':'☀';
    button.setAttribute('aria-label',light?'切换到深色':'切换到浅色');
    button.title=button.getAttribute('aria-label');
  }
  button.onclick=function(){
    chosen=(chosen||nativeTheme)==='light'?'dark':'light';
    try{localStorage.setItem(key,chosen);}catch(e){}
    apply();
    window.dispatchEvent(new Event('resize'));
  };
  window.addEventListener('storage',function(e){if(e.key===key||e.key===null){chosen=valid(e.newValue);apply();}});
  apply();
  var mounting=new MutationObserver(watchTheme);
  function watchTheme(){
    var viewport=document.querySelector('.xterm-viewport');
    if(!viewport)return;
    mounting.disconnect();
    function sync(){
      var rgb=getComputedStyle(viewport).backgroundColor.match(/[\d.]+/g);
      if(!rgb||rgb.length<3)return;
      nativeTheme=Number(rgb[0])*0.2126+Number(rgb[1])*0.7152+Number(rgb[2])*0.0722>128?'light':'dark';
      apply();
    }
    new MutationObserver(sync).observe(viewport,{attributes:true,attributeFilter:['style','class']});
    sync();
  }
  mounting.observe(document.body,{childList:true,subtree:true});
  watchTheme();
})();
</script>
